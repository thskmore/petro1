  h += '<div class="ops-subtabs noprint" style="margin-bottom:14px;background:rgba(0,0,0,0.03);padding:4px;border-radius:10px">';
  h += '<button class="ops-subtab-btn active" onclick="window.INDENTS_SUBTAB=\'indents\';renderIndentsTab()">🎫 Fleet Indents & Driver OTP (' + indents.length + ')</button>';
  h += '<button class="ops-subtab-btn" onclick="window.INDENTS_SUBTAB=\'loyalty\';if(typeof renderLoyaltyTab===\'function\')renderLoyaltyTab();else{tab=\'loyalty\';render();}">⭐ Driver Loyalty & Commercial Khata</button>';
  h += '</div>';

  // Header
  h += '<div class="row" style="align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px">';
  h += '<div><h1 style="margin:0">🎫 Fleet Indents & Credit Vouchers</h1><div class="sub" style="margin-top:2px">Vehicle fuel tokens, driver indent slips, and authorized transport credit vouchers.</div></div>';
  h += '<div class="btns" style="margin:0;flex:none">';
  h += '<button onclick="openIssueIndentModal()" style="display:inline-flex;align-items:center;gap:6px">+ Issue Indent Slip</button>';
  h += '<button class="ghost" onclick="loadIndentsData()" title="Refresh" style="padding:8px 12px">🔄</button>';
  h += '</div></div>';

  // KPI Metrics
  h += '<div class="ops-kpi-bar noprint">';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num" style="color:var(--warn)">' + (stats.pending_count || 0) + '</div><div class="ops-kpi-lbl">Pending Dispense</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num" style="color:var(--ok)">' + (stats.dispensed_today || 0) + '</div><div class="ops-kpi-lbl">Dispensed Today</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num">' + inr(stats.total_dispensed_amount || 0) + '</div><div class="ops-kpi-lbl">Total Billed Fleet Value</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num">' + customers.length + '</div><div class="ops-kpi-lbl">Fleet Customers</div></div>';
  h += '</div>';

  // Filter Bar
  h += '<div class="ho-filters noprint">';
  h += '<div class="ho-filter-row">';
  h += '<div class="ho-search-wrap">';
  h += '<span class="ho-search-icon">🔍</span>';
  h += '<input type="text" placeholder="Search vehicle no, slip #, driver..." value="' + esc(INDENT_SEARCH) + '" oninput="INDENT_SEARCH=this.value;loadIndentsData()">';
  h += '</div>';
  h += '<select style="margin:0;min-width:140px" onchange="INDENT_FILTER_STATUS=this.value;loadIndentsData()">';
  h += '<option value="all"' + (INDENT_FILTER_STATUS=="all"?' selected':'') + '>All Statuses</option>';
  h += '<option value="pending"' + (INDENT_FILTER_STATUS=="pending"?' selected':'') + '>⏳ Pending Dispense</option>';
  h += '<option value="dispensed"' + (INDENT_FILTER_STATUS=="dispensed"?' selected':'') + '>✅ Dispensed</option>';
  h += '<option value="cancelled"' + (INDENT_FILTER_STATUS=="cancelled"?' selected':'') + '>❌ Cancelled</option>';
  h += '</select>';
  h += '<select style="margin:0;min-width:160px" onchange="INDENT_CUST=this.value;loadIndentsData()">';
  h += '<option value="all">🏢 All Transporters</option>';
  customers.forEach(function(c){
    var sel = (INDENT_CUST == c.id) ? ' selected' : '';
    h += '<option value="' + c.id + '"' + sel + '>' + esc(c.name) + '</option>';
  });
  h += '</select>';
  h += '</div></div>';

  if (!indents.length) {
    h += '<div class="empty">No fleet indent slips found for this filter. Tap "+ Issue Indent Slip" to generate a new token.</div>';
  } else {
    indents.forEach(function(ind){
      var custObj = customers.find(function(c){ return String(c.id) === String(ind.cust_id); }) || { name: "Fleet Customer" };

      var isDispensed = ind.status === "dispensed";
      var isCancelled = ind.status === "cancelled";

      h += '<div class="ops-card">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)">';
      h += '<div>';

      h += '<span style="font-weight:800;font-size:16px;color:var(--btn)">' + esc(ind.indent_no) + '</span>';

      h += '<span style="font-weight:600;color:var(--ink)">' + esc(custObj.name) + '</span>';
      h += '</div>';
      h += '<div class="sub" style="font-size:12px;margin-top:4px">';
      h += 'Driver: <b>' + esc(ind.driver_name || 'Driver') + '</b>' + (ind.driver_mobile ? ' (' + esc(ind.driver_mobile) + ')' : '') + ' · Issued: ' + ind.issued_d;
      if (ind.odometer_km) h += ' · Odometer: ' + ind.odometer_km.toLocaleString("en-IN") + ' km';
      h += '</div>';
      h += '</div>';

      h += '<div style="display:flex;align-items:center;gap:6px">';
      if (isPending) h += '<span class="ops-pill ops-pill-warn">⏳ Pending Dispense</span>';
      else if (isDispensed) h += '<span class="ops-pill ops-pill-ok">✅ Dispensed</span>';
      else h += '<span class="ops-pill ops-pill-err">❌ Cancelled</span>';
      h += '</div>';
      h += '</div>';

      // Fulfillment details
      h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:12px 0">';
      h += '<div>';
      h += '<div class="sub" style="font-size:11px">Authorized Product & Limit</div>';
      h += '<div style="font-weight:700;font-size:14px;color:var(--ink)">' + esc(ind.fuel_product) + ' · ' + (ind.req_qty ? ind.req_qty + ' Litres' : inr(ind.req_amount)) + '</div>';
      h += '</div>';

      if (isDispensed) {
        h += '<div>';
        h += '<div class="sub" style="font-size:11px">Actual Dispensed & Rate</div>';
        h += '<div style="font-weight:800;font-size:15px;color:var(--ok)">' + ind.dispensed_qty + ' L @ ₹' + ind.dispensed_rate + ' = ' + inr(ind.dispensed_amount) + '</div>';
        h += '<div class="sub" style="font-size:11px">Attendant: ' + esc(ind.worker_name || 'Staff') + (ind.credit_sale_ref ? ' · Linked to Ledger' : '') + '</div>';
        h += '</div>';
      }

      h += '<div class="btns" style="margin:0">';
      if (isPending) {
        h += '<button onclick="openDispenseIndentModal(' + ind.id + ')" style="display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:7px 12px">⛽ Dispense Fuel</button>';
        h += '<button class="ghost" onclick="cancelIndent(' + ind.id + ')" style="font-size:12px;color:var(--due);padding:7px 10px">Cancel</button>';
      }
      h += '<button class="ghost" onclick="viewEnhancedIndentSlipModal(' + ind.id + ')" style="font-size:13px;padding:7px 12px">📄 Digital Slip</button>';
      h += '</div>';
      h += '</div>';

      if (ind.notes) {
        h += '<div class="sub" style="font-size:12px;font-style:italic">Note: ' + esc(ind.notes) + '</div>';
      }
      h += '</div>';
    });
  }

  A.innerHTML = h;
}

      }).join("")
    + '</select></label>'
    + '<div id="iss_credit_info" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12.5px"></div>'

function updateCustomerCreditHeadroom(){
  var custEl = document.getElementById("iss_cust");
  if (!custEl) return;
  var cid = custEl.value;
  var customers = (INDENTS_DATA && INDENTS_DATA.customers) ? INDENTS_DATA.customers : [];
  var c = customers.find(function(x){ return String(x.id) === String(cid); });
  var infoEl = document.getElementById("iss_credit_info");
  if (!infoEl) return;
  if (!c) { infoEl.innerHTML = ""; return; }

  var cDue = due(c);
  var cLimit = c.limit || 0;
  var avail = Math.max(0, cLimit - cDue);
  infoEl.innerHTML = 'Credit Limit: <b>' + inr(cLimit) + '</b> &nbsp;|&nbsp; Current Due: <b>' + inr(cDue) + '</b> &nbsp;|&nbsp; Available Headroom: <b style="color:' + (avail < 5000 ? 'var(--warn)' : 'var(--ok)') + '">' + inr(avail) + '</b>';
}

function submitIssueIndent(){
  var cid = v("iss_cust");
  var veh = v("iss_veh");
  var leaf = v("iss_leaf");
  var driver = v("iss_driver");
  var mobile = v("iss_mobile");
  var odom = v("iss_odometer");
  var fuel = v("iss_fuel");
  var qty = v("iss_qty");
  var amt = v("iss_amt");
  var note = v("iss_note");
  var errEl = document.getElementById("iss_err");

  if (!cid || !veh) {
    if (errEl) errEl.textContent = "Please select customer and enter vehicle number.";
    return;
  }

  api("POST", "/api/fleet-indents/issue", {
    cust_id: cid,
    vehicle_no: veh,
    slip_leaf_no: leaf,
    driver_name: driver,
    driver_mobile: mobile,
    fuel_product: fuel,
    req_qty: qty ? parseFloat(qty) : null,
    req_amount: amt ? parseFloat(amt) : null,
    odometer_km: odom ? parseFloat(odom) : null,
    notes: note
  }).then(function(res){
    close();
    toast("Indent slip " + res.indent_no + " issued! (Driver OTP: " + res.otp_code + ")");
    loadIndentsData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not issue indent.";
  });
}

function openDispenseIndentModal(indentId){
  var ind = (INDENTS_DATA && INDENTS_DATA.indents) ? INDENTS_DATA.indents.find(function(x){ return x.id === indentId; }) : null;
  if (!ind) return;

  var nozzles = (S && S.nozzles) ? S.nozzles.filter(function(n){ return n.active !== false; }) : [];
  var rates = (S && S.rates) ? S.rates : [];
  var defRate = 99;
  var rateObj = rates.find(function(r){ return r.fuel === ind.fuel_product; });
  if (rateObj) defRate = rateObj.rate;

  var h = '<h2>⛽ Dispense Fleet Indent</h2>'
    + '<div class="sub">Slip: <b>' + esc(ind.indent_no) + '</b> · Vehicle: <b>' + esc(ind.vehicle_no) + '</b> (' + esc(ind.fuel_product) + ')</div>'
    + (ind.slip_leaf_no ? '<div class="sub" style="margin-top:3px">Physical Slip Leaf #: <b>' + esc(ind.slip_leaf_no) + '</b></div>' : '')
    + '<label style="margin-top:12px">Dispenser Nozzle'
    + '<select id="dsp_nozzle">'
    + nozzles.map(function(n){ return '<option value="' + n.id + '">' + esc(n.name) + ' (' + esc(n.fuel) + ')</option>'; }).join("")
    + '</select></label>'
    + '<div class="row">'
    + '<label>Dispensed Litres<input type="number" step="0.01" id="dsp_qty" value="' + (ind.req_qty || '') + '" oninput="calcDispenseTotal()"></label>'
    + '<label>Rate (₹/L)<input type="number" step="0.01" id="dsp_rate" value="' + defRate + '" oninput="calcDispenseTotal()"></label>'
    + '</div>'
    + '<div style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;text-align:center">'
    + '<div class="sub" style="font-size:12px">Total Billed Amount</div>'
    + '<div style="font-size:24px;font-weight:800;color:var(--ok)" id="dsp_total_txt">' + inr((ind.req_qty || 0) * defRate) + '</div>'
    + '</div>'
    + '<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px;margin:10px 0">'
    + '<div style="font-weight:700;font-size:13px;color:#92400e">Driver Verification OTP (Fraud Protection)</div>'
    + '<div class="sub" style="font-size:12px;color:#78350f;margin-bottom:6px">Ask driver for the 4-digit SMS OTP (Demo Code: <b>' + (ind.otp_code || '8492') + '</b>)</div>'
    + '<input id="dsp_otp" value="' + (ind.otp_code || '8492') + '" placeholder="Enter 4-digit OTP" style="font-size:16px;letter-spacing:4px;font-weight:800;text-align:center">'
    + '</div>'
    + '<label style="display:flex;align-items:center;gap:8px;margin:10px 0">'
    + '<input type="checkbox" id="dsp_credit" checked style="width:auto;margin:0"> Post directly to Customer Credit Ledger'
    + '</label>'
    + '<label>Attendant / Meter Notes<input id="dsp_note" placeholder="e.g. Tank full filled, driver signed slip."></label>'
    + '<div class="err" id="dsp_err"></div>'
    + '<div class="btns" style="margin-top:14px;display:flex;gap:8px">'
    + '<button class="ghost" onclick="close()">Cancel</button>'
    + '<button style="flex:1" onclick="submitDispenseIndent(' + ind.id + ')">Verify OTP & Dispense Fuel</button>'
    + '</div>';

  openM(h);
  calcDispenseTotal();
}

function calcDispenseTotal(){
  var q = parseFloat((document.getElementById("dsp_qty")||{}).value) || 0;
  var r = parseFloat((document.getElementById("dsp_rate")||{}).value) || 0;
  var tot = Math.round(q * r * 100) / 100;
  var txtEl = document.getElementById("dsp_total_txt");
  if (txtEl) txtEl.textContent = inr(tot);
}

function submitDispenseIndent(indentId){
  var noz = v("dsp_nozzle");
  var qty = v("dsp_qty");
  var rate = v("dsp_rate");
  var otp = v("dsp_otp");
  var postCredit = document.getElementById("dsp_credit") ? document.getElementById("dsp_credit").checked : true;
  var note = v("dsp_note");
  var errEl = document.getElementById("dsp_err");

  if (!qty || parseFloat(qty) <= 0) {
    if (errEl) errEl.textContent = "Please enter dispensed quantity in litres.";
    return;
  }

  api("POST", "/api/fleet-indents/dispense", {
    indent_id: indentId,
    nozzle_id: noz,
    dispensed_qty: parseFloat(qty),
    dispensed_rate: parseFloat(rate),
    post_to_credit: postCredit,
    otp_entered: otp,
    notes: note
  }).then(function(res){
    close();
    toast("Driver OTP verified! Fuel dispensed and posted to ledger.");
    loadIndentsData();
    viewIndentVoucherModal(indentId);
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not fulfill indent.";
  });
}

  var bName = (S && S.biz && S.biz.name) ? S.biz.name : "Rituraj Petroleum";
  var bAddr = (S && S.biz && S.biz.addr) ? S.biz.addr : "Mahud";
  var bGst = (S && S.biz && S.biz.gst) ? S.biz.gst : "";

var LUBES_DATA = null;

function loadLubesData(){
  LUBES_LOADING = true;
  api("GET", "/api/lube-module?category=" + encodeURIComponent(LUBE_CAT_FILTER) + "&search=" + encodeURIComponent(LUBE_SEARCH))
    .then(function(res){
      LUBES_DATA = res;
      LUBES_LOADING = false;
      if (tab === "lubes") renderLubesTab();
    })
    .catch(function(err){
      LUBES_LOADING = false;
      toast(err.error || "Could not load lube data.");
      if (tab === "lubes") renderLubesTab();
    });
}

function adjustLubeQty(delta){
  var qEl = document.getElementById("qls_qty");
  if (!qEl) return;
  var cur = parseInt(qEl.value) || 1;
  var next = Math.max(1, cur + delta);
  qEl.value = next;
  updateLubeSaleCalc();
}

function updateLubeSaleCalc(){
  var itemEl = document.getElementById("qls_item");
  if (!itemEl) return;
  var opt = itemEl.options[itemEl.selectedIndex];
  if (!opt) return;
  var price = parseFloat(opt.getAttribute("data-price")) || 0;
  var inc = parseFloat(opt.getAttribute("data-inc")) || 0;
  var qty = parseInt((document.getElementById("qls_qty")||{}).value) || 1;

  var tot = price * qty;
  var totInc = inc * qty;

  var totEl = document.getElementById("qls_total_txt");
  var incEl = document.getElementById("qls_inc_txt");
  if (totEl) totEl.textContent = inr(tot);
  if (incEl) incEl.textContent = "Driveway Staff Incentive: +₹" + totInc;
}

function submitQuickLubeSale(){
  var itemId = v("qls_item");
  var qty = v("qls_qty");
  var mode = v("qls_mode");
  var veh = v("qls_veh");
  var notes = v("qls_notes");
  var errEl = document.getElementById("qls_err");

  if (!itemId || !qty || parseInt(qty) <= 0) {
    if (errEl) errEl.textContent = "Please select product and quantity.";
    return;
  }

  api("POST", "/api/lube-sale", {
    item_id: itemId,
    qty: parseFloat(qty),
    payment_mode: mode,
    vehicle_no: veh,
    notes: notes
  }).then(function(res){
    close();
    toast("Lube sale recorded! (+₹" + res.incentive_amount + " incentive earned)");
    loadLubesData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not record sale.";
  });
}

var CALIB_DATA = null;
var CALIB_LOADING = false;

function loadCalibrationData(){
  CALIB_LOADING = true;
  api("GET", "/api/calibration-log?nozzle_id=" + encodeURIComponent(CALIB_NOZZLE))
    .then(function(res){
      CALIB_DATA = res;
      CALIB_LOADING = false;

    .catch(function(err){
      CALIB_LOADING = false;

    }
  } else {
    // Stamping Certificates
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
    certs.forEach(function(c){
      var expiryDate = new Date(c.expiry_date);

      var isExpiringSoon = daysLeft < 45;

      h += '<div style="font-weight:800;font-size:15px;color:var(--ink)">' + esc(c.equipment_name) + '</div>';

      h += '</div>';

      h += '<div style="margin:10px 0;font-size:12.5px;line-height:1.6;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line)">';
      h += '<div>Serial #: <b>' + esc(c.serial_no) + '</b></div>';
      h += '<div>Cert #: <b>' + esc(c.cert_no) + '</b></div>';
      h += '<div>Stamping Date: <b>' + c.stamping_date + '</b></div>';
      h += '<div>Valid Till: <b style="color:' + (isExpiringSoon ? 'var(--warn)' : 'var(--ink)') + '">' + c.expiry_date + '</b></div>';
      h += '<div class="sub" style="font-size:11px;margin-top:4px">' + esc(c.inspector_name || '') + ' · ' + esc(c.department || '') + '</div>';

      if (c.notes) {

    });
    h += '</div>';
  }

  A.innerHTML = h;
}

function autoFillCalibTank(){
  var nozEl = document.getElementById("cal_nozzle");
  if (!nozEl) return;
  var opt = nozEl.options[nozEl.selectedIndex];
  var tankId = opt ? opt.getAttribute("data-tank") : "";
  var tankEl = document.getElementById("cal_tank");
  if (tankEl && tankId) tankEl.value = tankId;
}

function calcCalibDiff(){
  var del = parseFloat((document.getElementById("cal_delivered")||{}).value);
  if (isNaN(del)) return;
  var err = Math.round(del - 5000);
  var isPass = Math.abs(err) <= 25;
  var errEl = document.getElementById("cal_err_val");
  var statEl = document.getElementById("cal_stat_val");

  if (errEl) {
    errEl.textContent = (err > 0 ? "+" : "") + err + " ml (" + (err/50).toFixed(2) + "%)";
    errEl.style.color = isPass ? "var(--ok)" : "var(--due)";
  }
  if (statEl) {
    statEl.innerHTML = isPass
      ? '<span style="color:var(--ok)">✅ WITHIN LEGAL TOLERANCE (±25 ml / 0.5%) - PASSED</span>'
      : '<span style="color:var(--due)">⚠️ EXCEEDS TOLERANCE - NOZZLE REQUIRES CALIBRATION</span>';
  }
}

function submit5LCalibration(){
  var nozId = v("cal_nozzle");
  var d = v("cal_date");
  var shift = v("cal_shift");
  var del = v("cal_delivered");
  var tankId = v("cal_tank");
  var sr = v("cal_measure_sr");
  var notes = v("cal_notes");
  var errEl = document.getElementById("cal_err");

  if (!nozId || !del) {
    if (errEl) errEl.textContent = "Please select nozzle and enter delivered volume in ml.";
    return;
  }

  api("POST", "/api/calibration-log", {
    d: d,
    shift: shift,
    nozzle_id: nozId,
    measure_qty: 5000,
    delivered_ml: parseFloat(del),
    returned_to_tank_id: tankId,
    stamped_measure_sr: sr,
    notes: notes
  }).then(function(){
    close();
    toast("Nozzle calibration verified and logged!");
    loadCalibrationData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not save calibration log.";
  });
}

    h += '<span style="font-weight:600;color:var(--ink)">±' + normPct + '% of sales (' + (isDiesel ? 'Low volatility HSD' : 'High volatility MS') + ')</span>';
    h += '</div>';
    h += '<div class="ops-bar-bg">';
    h += '<div class="ops-bar-fill" style="width:' + barWidth + '%;background:' + (isWithin ? 'var(--ok)' : 'var(--due)') + '"></div>';
    h += '</div>';
    h += '<div class="sub" style="font-size:11px">' + barWidth.toFixed(0) + '% of maximum allowable handling loss quota used</div>';
    h += '</div>';

    h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px">';
    h += '<span>Total Sales: <b>' + Number(ts.total_sales).toLocaleString("en-IN") + ' L</b></span>';
    h += '<span>Inward Receipts: <b>' + Number(ts.total_receipts).toLocaleString("en-IN") + ' L</b></span>';
    h += '</div>';
    h += '</div>';
  });
  h += '</div></div>';

  // Physics & Temperature Analysis
  h += '<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px">';
  h += '<div style="font-weight:700;font-size:14px;color:var(--ink);margin-bottom:4px">💡 Petroleum Physics & OMC Evaporation Allowance Norms</div>';
  h += '<div class="sub" style="font-size:12.5px;line-height:1.5">';
  h += '• <b>Motor Spirit (Petrol / MS):</b> Highly volatile light hydrocarbon with boiling point 35°C–215°C. The Ministry of Petroleum & Natural Gas OMC guidelines allow up to <b>0.59%</b> handling loss (0.75% during summer).<br>';
  h += '• <b>High Speed Diesel (HSD):</b> Heavy hydrocarbon fuel with low vapor pressure; standard allowable loss norm is <b>0.15%</b>.<br>';
  h += '• <b>Temperature Coefficient:</b> A 1°C temperature drop between morning tanker decantation and underground storage can cause up to 0.07% volumetric shrinkage without any mass loss.';
  h += '</div>';
  h += '</div>';

  // Daily Reconciliation Ledger
  h += '<div style="font-weight:800;font-size:15px;color:var(--ink);margin-bottom:10px">Chronological Daily Storage Tank Reconciliation Log</div>';
  if (!logs.length) {
    h += '<div class="empty">No daily reconciliation logs found. Click "+ Log Daily Reconciliation" to record closing tank dips.</div>';
  } else {
    h += '<div class="ops-table-wrap">';
    h += '<table class="ops-table">';
    h += '<thead><tr>';
    h += '<th>Date</th><th>Tank & Fuel</th><th>Opening Dip (L)</th><th>(+) Inward (L)</th><th>(-) Sales (L)</th><th>(=) Book Stock</th><th>Closing Dip (L)</th><th>Variance (L & %)</th><th>Status</th><th>Notes</th>';
    h += '</tr></thead><tbody>';
    logs.forEach(function(row){
      var tObj = data.tanks.find(function(t){ return String(t.id) === String(row.tank_id); }) || { name: "Tank " + row.tank_id };
      var diff = Number(row.variance_qty);
      var diffStr = (diff > 0 ? "+" : "") + diff + " L (" + (row.variance_pct > 0 ? "+" : "") + row.variance_pct + "%)";
      var isPass = row.is_within_norm === 1;

      h += '<tr>';
      h += '<td data-label="Date" style="font-weight:700;white-space:nowrap">' + row.d + '</td>';
      h += '<td data-label="Tank & Fuel"><b>' + esc(tObj.name) + '</b><br><span class="sub" style="font-size:11px">' + esc(row.fuel_type) + '</span></td>';
      h += '<td data-label="Opening Dip">' + Number(row.opening_dip_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="(+) Receipts">' + (row.receipts_qty ? '+' + Number(row.receipts_qty).toLocaleString("en-IN") + ' L' : '0 L') + '</td>';
      h += '<td data-label="(-) Sales" style="color:var(--due)">-' + Number(row.sales_dispensed_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="(=) Book Stock" style="font-weight:700">' + Number(row.book_stock_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="Closing Dip" style="font-weight:800;color:var(--ink)">' + Number(row.physical_dip_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="Variance" style="font-weight:700;color:' + (isPass ? 'var(--ok)' : 'var(--due)') + '">' + diffStr + '</td>';
      h += '<td data-label="Status"><span class="ops-pill ' + (isPass ? 'ops-pill-ok' : 'ops-pill-err') + '">' + (isPass ? 'Within Norms' : 'Excess Loss') + '</span></td>';
      h += '<td data-label="Notes" class="sub" style="font-size:11.5px">' + esc(row.notes || 'Routine reconciliation') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  A.innerHTML = h;
}

function calcReconcileLive(){
  var openL = parseFloat((document.getElementById("rec_open")||{}).value) || 0;
  var recL = parseFloat((document.getElementById("rec_receipts")||{}).value) || 0;
  var saleL = parseFloat((document.getElementById("rec_sales")||{}).value) || 0;
  var physL = parseFloat((document.getElementById("rec_phys")||{}).value);

  var tankEl = document.getElementById("rec_tank");
  var opt = tankEl ? tankEl.options[tankEl.selectedIndex] : null;
  var fuel = opt ? opt.getAttribute("data-fuel") : "Diesel (HSD)";
  var isDiesel = fuel.indexOf("Diesel") > -1 || fuel.indexOf("HSD") > -1;
  var norm = isDiesel ? 0.15 : 0.59;

  var bookStock = Math.round((openL + recL - saleL) * 10) / 10;
  var bookEl = document.getElementById("rec_book_val");
  var varEl = document.getElementById("rec_var_val");
  var statEl = document.getElementById("rec_status_val");

  if (bookEl) bookEl.textContent = bookStock.toLocaleString("en-IN") + " L";

  if (!isNaN(physL)) {
    var diffL = Math.round((physL - bookStock) * 10) / 10;
    var pct = bookStock > 0 ? Math.round((diffL / bookStock) * 10000) / 100 : 0;
    var isWithin = Math.abs(pct) <= norm;

    if (varEl) {
      varEl.textContent = (diffL > 0 ? "+" : "") + diffL + " L (" + (pct > 0 ? "+" : "") + pct + "%)";
      varEl.style.color = isWithin ? "var(--ok)" : "var(--due)";
    }
    if (statEl) {
      statEl.innerHTML = isWithin
        ? '<span style="color:var(--ok)">✅ Strictly within OMC Evaporation Norm (Limit ±' + norm + '%)</span>'
        : '<span style="color:var(--due)">⚠️ EXCEEDS OMC EVAPORATION ALLOWANCE (Diff: ' + pct + '%)</span>';
    }
  }
}

function submitReconciliation(){
  var tankId = v("rec_tank");
  var d = v("rec_date");
  var openL = v("rec_open");
  var recL = v("rec_receipts");
  var saleL = v("rec_sales");
  var cm = v("rec_cm");
  var physL = v("rec_phys");
  var temp = v("rec_temp");
  var notes = v("rec_notes");
  var errEl = document.getElementById("rec_err");

  if (!tankId || !physL) {
    if (errEl) errEl.textContent = "Please select tank and enter physical dip litres.";
    return;
  }

  api("POST", "/api/loss-gain-reconcile", {
    d: d,
    tank_id: tankId,
    opening_dip_qty: openL ? parseFloat(openL) : 0,
    receipts_qty: recL ? parseFloat(recL) : 0,
    sales_dispensed_qty: saleL ? parseFloat(saleL) : 0,
    closing_dip_cm: cm ? parseFloat(cm) : null,
    physical_dip_qty: parseFloat(physL),
    temp_avg: temp ? parseFloat(temp) : null,
    notes: notes
  }).then(function(){
    close();
    toast("Daily tank reconciliation saved!");
    loadLossGainData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not save reconciliation.";
  });
}

<script>
function applyResponsiveTableLabels(rootEl) {
  var root = rootEl || document;
  var tables = root.querySelectorAll(".ops-table, .tbl table, table");
  tables.forEach(function(tbl){
    var headerRow = tbl.querySelector("thead tr") || tbl.querySelector("tr:has(th)") || tbl.querySelector("tr");
    if (!headerRow) return;
    var thEls = headerRow.querySelectorAll("th");
    if (!thEls.length) return;
    headerRow.classList.add("ops-mobile-header-row");
    var ths = Array.from(thEls).map(function(th){
      return th.textContent.trim().replace(/\s+/g, " ");
    });

    var rows = tbl.querySelectorAll("tbody tr, tr");
    rows.forEach(function(tr){
      if (tr === headerRow || tr.classList.contains("ops-mobile-header-row") || tr.querySelector("th")) {
        tr.classList.add("ops-mobile-header-row");
        return;
      }
      var tds = tr.querySelectorAll("td");
      if (tds.length === 1 && (tds[0].colSpan > 1 || tds[0].classList.contains("empty"))) {
        tds[0].classList.add("ops-mobile-fullwidth-cell");
        return;
      }
      tds.forEach(function(td, idx){
        if (!td.getAttribute("data-label") && ths[idx]) {
          td.setAttribute("data-label", ths[idx]);
        }
      });
    });
  });
}

if (window.MutationObserver) {
  var opsTableObserver = new MutationObserver(function(){
    var app = document.getElementById("app");
    if (app) applyResponsiveTableLabels(app);
  });
  window.addEventListener("DOMContentLoaded", function(){
    var app = document.getElementById("app");
    if (app) opsTableObserver.observe(app, { childList: true, subtree: true });
    applyResponsiveTableLabels(document);
  });
}

boot();
</script>
