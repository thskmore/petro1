#modal.on{display:flex}

.empty{padding:28px 10px;text-align:center;color:var(--mute)}
@media print{.noprint,button,#bdg,#modal{display:none!important}body{background:#fff!important;color:#000!important;font-size:12px}.wrap{max-width:100%!important;padding:0!important;margin:0!important}.tbl{border:1px solid #ccc!important;box-shadow:none!important;margin-bottom:12px;page-break-inside:avoid}table{width:100%!important;font-size:11px!important}th,td{padding:6px 8px!important;border-bottom:1px solid #ccc!important}h1{font-size:15px!important;color:#000!important;margin-top:16px!important}.sub{color:#555!important;font-size:11px!important}}
#bdg{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:var(--due);color:#fff;padding:8px 12px;font-size:14px;z-index:9;text-align:center}

.chart-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;position:relative}
.chart-tooltip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:20;display:none;max-width:240px;color:var(--ink)}
.an-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.an-kpi-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.an-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:default}
.an-chip i{display:inline-block;width:9px;height:9px;border-radius:50%}

<script>
function emptyS(){return{c:[],inv:[],items:[],sup:[],bk:[],nozzles:[],tanks:[],deliv:[],rates:[],expcats:[],paymodes:[],ob:{Cash:0,Bank:0,UPI:0},biz:{name:"",addr:"",gst:""}}}
var KEY="petrol-credit-ledger-v1",S=emptyS(),view=null,from="",to="",onlyDue=false,cb,tab="ledger",dr=null,iv=null,sv=null,bf="all",rf=today().slice(0,8)+"01",rt=today();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
var d=function(n){return new Date(Date.now()-n*864e5).toISOString().slice(0,10)};
return{c:[
{id:1,name:"Shree Transport",phone:"9876500011",gst:"27ABCDE1234F1Z5",veh:["MH12 AB 1234","MH12 CD 5678"],limit:50000,e:[{d:d(9),t:"sale",n:"HSD 300 L",a:28500},{d:d(5),t:"pay",n:"UPI",a:10000},{d:d(2),t:"sale",n:"HSD 150 L",a:14250}]},
{id:2,name:"Patil Agro Services",phone:"9876500022",gst:"",veh:["MH14 XY 9090"],limit:20000,e:[{d:d(6),t:"sale",n:"MS 100 L",a:10800},{d:d(3),t:"sale",n:"Power MS 60 L",a:7100}]},
{id:3,name:"City Cab Fleet",phone:"9876500033",gst:"27PQRST5678G1Z2",veh:[],limit:30000,e:[{d:d(4),t:"sale",n:"MS 200 L",a:21600},{d:d(1),t:"pay",n:"Cash",a:21600}]}]}}
function save(){if(!SRV){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}clearTimeout(saveT);saveT=setTimeout(push,400)}
function due(c){if(!c||!c.e)return 0;return c.e.reduce(function(s,x){return s+(x.t=="sale"?x.a:-x.a)},0)}
function inr(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function find(id){if(!S||!S.c)return null;return S.c.filter(function(c){return c.id==id})[0]}
function render(){if(!S)S=emptyS();if(!S.c)S.c=[];if(SRV&&!ME)return;if(tab=="inv")return renderInv();if(tab=="stock")return renderStock();if(tab=="sup")return renderSup();if(tab=="book")return renderBook();if(tab=="rep")return renderRep();if(tab=="analytics")return renderAnalytics();if(tab=="audit")return renderAudit();if(tab=="bak"){tab="setup";SU="bak";return renderSetup();}if(tab=="team"){tab="setup";SU="team";return renderSetup();}if(tab=="credit")return renderCredit();if(tab=="duty")return renderDutyTab();if(tab=="tanks")return renderTanks();if(tab=="wdip")return loadDip();if(tab=="pay")return renderSalary();if(tab=="setup")return renderSetup();if(tab=="mypay")return loadMyPay();if(tab=="wduty")return loadW();var h="";
if(!view){var tot=S.c.reduce(function(s,c){return s+due(c)},0),q=(document.getElementById("q")||{}).value||"";
h+=nav()+pendHtml()+'<h1>Total credit outstanding</h1><div class="total">'+inr(tot)+'</div><div class="row"><input id="q" placeholder="Search name or vehicle" value="'+esc(q)+'" oninput="render();var i=document.getElementById(\'q\');i.focus();i.setSelectionRange(99,99)"><button onclick="custForm()">Add customer</button></div><button class="ghost" style="width:100%;margin-top:8px" onclick="bulkForm()">Send reminders to everyone with dues</button><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" '+(onlyDue?'checked':'')+' onchange="onlyDue=this.checked;render()">Only customers with dues</label>';
var l=S.c.filter(function(c){var t=(c.name+c.veh.join(" ")).toLowerCase();return t.indexOf(q.toLowerCase())>-1&&(!onlyDue||due(c)>0)});
if(!l.length)h+='<div class="empty">No credit customers found. Add one to start a ledger.</div>';
l.forEach(function(c){var d=due(c),p=c.limit?Math.min(100,d/c.limit*100):0;
h+='<div class="cust" tabindex="0"'+(c.active===false?' style="opacity:.6"':'')+' onclick="view='+c.id+';render()" onkeydown="if(event.key==\'Enter\'){view='+c.id+';render()}"><div class="row"><b>'+esc(c.name)+(c.active===false?' (inactive)':'')+'</b><span class="amt" style="text-align:right;flex:none;color:'+(d>0?'var(--due)':'var(--ok)')+'">'+inr(d)+'</span></div><div class="sub">'+(c.veh.length?esc(c.veh.join(", ")):"No vehicles added")+'</div><div class="bar"><i style="width:'+p+'%;background:'+(p>=90?'var(--due)':p>=70?'var(--warn)':'var(--ok)')+'"></i></div><div class="sub" style="margin-top:4px">'+Math.round(p)+'% of '+inr(c.limit)+' limit used</div></div>'}
)}else{var c=find(view),d=due(c),bal=0;
h+='<button class="ghost noprint" onclick="view=null;render()">Back to customers</button><h1 style="margin-top:14px">'+esc(c.name)+'</h1><div class="total">'+inr(d)+'</div><div class="sub">Limit '+inr(c.limit)+' · Available '+inr(Math.max(0,c.limit-d))+'</div><div class="sub">'+esc(c.phone)+(c.gst?' · GST '+esc(c.gst):'')+'</div><div class="sub">Vehicles: '+(c.veh.length?esc(c.veh.join(", ")):"none added")+'</div>'+
'<div class="btns noprint"><button onclick="entryForm(\'sale\')">Add credit sale</button><button onclick="entryForm(\'pay\')">Receive payment</button><button class="ghost" style="display:inline-flex;align-items:center;gap:6px" onclick="downloadCustPDF()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>Download PDF</button><button class="ghost" onclick="remind()">Send WhatsApp reminder</button><button class="ghost" onclick="custForm('+c.id+')">Edit details</button><button class="ghost" onclick="window.print()">Print statement</button><button class="ghost" onclick="stmt()">Share statement</button></div>';
h+=ageing(c)+'<div class="row noprint"><label>From<input type="date" value="'+from+'" onchange="from=this.value;render()"></label><label>To<input type="date" value="'+to+'" onchange="to=this.value;render()"></label></div>';
h+='<div class="tbl" style="margin-top:12px"><table><tr><th>Date</th><th>Detail</th><th class="r">Amount</th><th class="r">Balance</th><th class="noprint"></th></tr>';var n=0;
rows(c).forEach(function(o){var x=o.x;if(o.skip)return;n++;
h+='<tr><td>'+x.d.slice(5)+'</td><td>'+(x.t=="sale"?"Sale: ":"Paid: ")+esc(x.n)+'</td><td class="r '+x.t+'">'+(x.t=="sale"?"+":"\u2212")+inr(x.a)+'</td><td class="r">'+inr(o.bal)+'</td><td class="noprint" style="white-space:nowrap">'+(x.srv?'':'<button class="ghost" style="padding:5px 8px" onclick="entryForm(\''+x.t+'\','+o.i+')">Edit</button> ')+'<button class="ghost" style="padding:5px 8px" onclick="delEntry('+o.i+')">Delete</button></td></tr>'});
if(!n)h+='<tr><td colspan="5" class="empty">No entries in this range.</td></tr>';
h+='</table></div>'}
document.getElementById("app").innerHTML=h}
function openM(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("on")}
function closeM(){document.getElementById("modal").classList.remove("on")}
function close(){closeM()}
window.closeM=closeM;
document.getElementById("modal").onclick=function(e){if(e.target.id=="modal")closeM()};
function v(id){return document.getElementById(id).value.trim()}
function custForm(id){var c=id?find(id):{name:"",phone:"",gst:"",veh:[],limit:""};
openM('<h2>'+(id?'Edit customer':'Add credit customer')+'</h2><label>Name<input id="f1" value="'+esc(c.name)+'"></label><label>Phone (WhatsApp)<input id="f2" inputmode="tel" value="'+esc(c.phone)+'"></label><label>GST number (optional)<input id="f3" value="'+esc(c.gst)+'"></label><label>Vehicle numbers, separated by commas<input id="f4" value="'+esc(c.veh.join(", "))+'"></label><label>Credit limit (₹)<input id="f5" inputmode="numeric" value="'+esc(c.limit)+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="closeM()">Cancel</button><button onclick="saveCust('+(id||0)+')">Save customer</button></div>')}
function saveCust(id){var n=v("f1"),p=v("f2").replace(/\D/g,""),l=parseFloat(v("f5"));
if(!n)return er("Enter the customer name.");if(p.length<10)return er("Enter a 10-digit phone number.");if(!(l>0))return er("Enter a credit limit above zero.");
var o={name:n,phone:p,gst:v("f3").toUpperCase(),veh:v("f4").split(",").map(function(s){return s.trim().toUpperCase()}).filter(Boolean),limit:l};
if(id){Object.assign(find(id),o)}else{o.id=Date.now();o.e=[];S.c.push(o)}save();closeM();render()}
function er(m){document.getElementById("er").textContent=m}
function rows(c){var bal=0;return c.e.map(function(x,i){return{x:x,i:i}}).sort(function(p,q){return p.x.d<q.x.d?-1:1}).map(function(o){bal+=o.x.t=="sale"?o.x.a:-o.x.a;o.bal=bal;o.skip=(from&&o.x.d<from)||(to&&o.x.d>to);return o})}
function ageing(c){var paid=c.e.reduce(function(s,x){return s+(x.t=="pay"?x.a:0)},0),k=[0,0,0,0],now=Date.now(),L=["0-30 days","31-60","61-90","90+"];
c.e.filter(function(x){return x.t=="sale"}).sort(function(p,q){return p.d<q.d?-1:1}).forEach(function(x){var r=x.a,u=Math.min(paid,r);paid-=u;r-=u;if(r>0){var dy=Math.floor((now-new Date(x.d))/864e5);k[dy<=30?0:dy<=60?1:dy<=90?2:3]+=r}});
return '<div class="sub" style="margin-top:12px">Overdue ageing</div><div class="row" style="gap:6px">'+k.map(function(v,i){return '<div class="cust" style="margin:4px 0 0;padding:8px;cursor:default;text-align:center"><div class="sub">'+L[i]+'</div><b style="color:'+(i>1&&v>0?'var(--due)':'var(--ink)')+'">'+inr(v)+'</b></div>'}).join("")+'</div>'}
function ask(m,fn){cb=fn;openM('<h2>Please confirm</h2><div class="sub">'+esc(m)+'</div><div class="row" style="margin-top:14px"><button class="ghost" onclick="closeM()">Cancel</button><button id="btnAskConfirm" onclick="doAskConfirm()">Yes, continue</button></div>')}
function doAskConfirm(){closeM();if(typeof cb==="function"){var f=cb;cb=null;f();}}
function entryForm(t,i){var c=find(view),s=t=="sale",x=i!=null?c.e[i]:null;
openM('<h2>'+(x?'Edit ':'Add ')+(s?'credit sale':'payment')+'</h2><div class="sub">'+esc(c.name)+' \u00b7 Due '+inr(due(c))+'</div><label>Date<input id="f1" type="date" value="'+(x?x.d:today())+'"></label><label>'+(s?'Fuel / item and quantity<input id="f2" value="'+esc(x?x.n:"")+'" placeholder="e.g. HSD 200 L">':'Mode<select id="f2"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Cheque</option></select>')+'</label><label>Amount (\u20b9)<input id="f3" inputmode="decimal" value="'+(x?x.a:"")+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveEntry(\''+t+'\','+(i==null?'null':i)+')">Save</button></div>');
if(x&&!s)document.getElementById("f2").value=x.n}
function saveEntry(t,i){var c=find(view),a=parseFloat(v("f3")),old=i!=null?c.e[i]:null,cur=due(c)-(old?(old.t=="sale"?old.a:-old.a):0);
if(!(a>0))return er("Enter an amount above zero.");if(!v("f2"))return er("Enter the item and quantity.");
var o={d:v("f1"),t:t,n:v("f2"),a:a};
function go(){if(old)c.e[i]=o;else c.e.push(o);save();close();render()}
if(t=="sale"&&cur+a>c.limit)return ask("This sale takes "+c.name+" over the credit limit by "+inr(cur+a-c.limit)+". Save anyway?",go);
if(t=="pay"&&a>cur)return ask("Payment is more than the amount due. Save anyway?",go);go()}
function delEntry(i){var c=find(view),x=c.e[i];ask("Delete the "+(x.t=="sale"?"sale":"payment")+" of "+inr(x.a)+" ("+x.n+")?",function(){if(x.srv){var ep=String(x.srv).indexOf("rec_")===0?("/api/credit-recoveries/"+x.srv.slice(4)):("/api/credit-sales/"+x.srv);api("DELETE",ep).then(function(){pullDuty(render)}).catch(function(e){badge(e.error||"Could not delete.")});return}c.e.splice(i,1);save();render()})}
function stmt(){var c=find(view),t="Statement for "+c.name+(from||to?" ("+(from||"start")+" to "+(to||"today")+")":"")+"\n";
rows(c).forEach(function(o){if(!o.skip)t+=o.x.d+" "+(o.x.t=="sale"?"Sale ":"Paid ")+o.x.n+" "+(o.x.t=="sale"?"+":"-")+Math.round(o.x.a)+" | Bal "+Math.round(o.bal)+"\n"});
t+="Total outstanding: "+inr(due(c));window.open("https://wa.me/91"+c.phone.slice(-10)+"?text="+encodeURIComponent(t),"_blank")}
function downloadCustPDF(){

  var curY=78;

  doc.text(vehStr,40,curY+62);

  doc.setFont("helvetica","bold");
  doc.setFontSize(8.5);
  doc.setTextColor(100,115,120);
  doc.text("CURRENT ACCOUNT STATUS",315,curY+16);

  doc.setFont("helvetica","bold");
  doc.setFontSize(9);

function getTanksStockList(){

  if(TK_STOCK_CACHE&&TK_STOCK_CACHE.length){
    TK_STOCK_CACHE.forEach(function(c){cacheMap[String(c.id)]=c});
  }
  return (S.tanks||[]).map(function(t){
    var c=cacheMap[String(t.id)];
    if(c){
      return Object.assign({},c,{name:t.name,fuel:t.fuel,capacity:t.capacity||c.capacity});
    }
    return {id:t.id,name:t.name,fuel:t.fuel,capacity:t.capacity||0,book:null,last:null,checks:[]};
  });

function getRepData(){

  var buy={"Oil company":0,"Dealer":0};

  var ex={},exT=0,inc=0;

  var net=sales+inc-buy["Oil company"]-buy.Dealer-exT;
  var expList=Object.keys(ex).sort(function(a,b){return ex[b]-ex[a]}).map(function(k){return {category:k,amount:ex[k]}});
  var cs=S.c.filter(function(c){return due(c)>0}).sort(function(a,b){return due(b)-due(a)});

  });
  return {rf:rf,rt:rt,sales:sales,cg:cg,ig:ig,n:n,buy:buy,ex:ex,exT:exT,inc:inc,net:net,expList:expList,customers:cs,totalDue:ct,items:items,costVal:cv,sellVal:rv};

function dAgo(n){return new Date(Date.now()-n*864e5).toISOString().slice(0,10)}
function getAnFrom(){
  if(AN_RANGE==="7")return dAgo(7);
  if(AN_RANGE==="30")return dAgo(30);
  if(AN_RANGE==="90")return dAgo(90);
  if(AN_RANGE==="all")return "";
  if(AN_RANGE==="custom")return AN_FROM;
  return dAgo(30);
}
function getAnTo(){
  if(AN_RANGE==="all")return "";
  if(AN_RANGE==="custom")return AN_TO;

}
function setAnRange(r){
  AN_RANGE=r;
  if(r!=="custom"){loadAnalytics(true)}else{drawAnalytics()}
}
function applyCustomAnRange(){
  var fi=document.getElementById("anFromInput"),ti=document.getElementById("anToInput");
  AN_FROM=fi?fi.value:"";AN_TO=ti?ti.value:"";loadAnalytics(true);
}
function setAnMetric(m){AN_METRIC=m;drawAnalytics()}
function setAnFuelView(v){AN_FUEL_VIEW=v;drawAnalytics()}
function setAnExpView(v){AN_EXP_VIEW=v;drawAnalytics()}
function renderAnalytics(){
  tab="analytics";
  if(!AN_DATA&&!AN_LOADING){loadAnalytics(true)}else{drawAnalytics()}
}
function loadAnalytics(force){
  if(AN_DATA&&!force){drawAnalytics();return}
  AN_LOADING=true;drawAnalytics();
  var f=getAnFrom(),t=getAnTo(),p=[];
  if(f)p.push("from="+f);
  if(t)p.push("to="+t);
  var url="/api/analytics"+(p.length?"?"+p.join("&"):"");
  if(!SRV){setTimeout(function(){AN_LOADING=false;drawAnalytics()},100);return}
  api("GET",url).then(function(res){
    AN_DATA=res;AN_LOADING=false;
    if(tab==="analytics")drawAnalytics();
  }).catch(function(err){
    AN_LOADING=false;badge(err.error||"Could not load analytics.");
    if(tab==="analytics")drawAnalytics();
  });
}

    });

function renderAnCharts(){
  if(!AN_DATA||typeof d3==="undefined")return;
  var daily=AN_DATA.daily||[];
  var monthly=AN_DATA.monthly||[];
  var exps=AN_DATA.expenseBreakdown||[];
  renderD3DailyChart(daily,AN_METRIC,AN_FUEL_VIEW);
  renderD3MonthlyChart(monthly,AN_METRIC);
  if(AN_EXP_VIEW==='donut'){renderD3ExpenseDonut(exps)}else{renderD3ExpenseBars(exps)}
}

function renderD3DailyChart(dailyData,metric,viewMode){
  var container=document.getElementById("d3-daily-chart");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!dailyData||!dailyData.length){
    container.innerHTML='<div class="empty">No daily fuel sales in this period.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.max(300,rect.width||520);
  var height=230;
  var margin={top:20,right:16,bottom:32,left:metric==="rev"?58:50};

  var parseTime=d3.timeParse("%Y-%m-%d");
  var formatted=dailyData.map(function(d){
    var obj={date:parseTime(d.date)||new Date(d.date),rawDate:d.date,byFuel:d.byFuel||{}};
    obj.val=metric==="vol"?(d.litres||0):(d.revenue||0);
    return obj;
  });

  var svg=d3.select(container).append("svg")
    .attr("viewBox","0 0 "+width+" "+height)
    .attr("width","100%").attr("height",height).style("overflow","visible");

  var tooltip=d3.select(container).append("div").attr("class","chart-tooltip");

  var x=d3.scaleTime().domain(d3.extent(formatted,function(d){return d.date})).range([margin.left,width-margin.right]);

  var fuelTypes=["Diesel (HSD)","Petrol (MS)","Power petrol"];
  var fuelColors={"Diesel (HSD)":"#2563eb","Petrol (MS)":"#059669","Power petrol":"#d97706","Other":"#7c3aed"};

  var yMax=0;
  if(viewMode==="byfuel"){
    formatted.forEach(function(d){
      fuelTypes.forEach(function(f){
        var fv=d.byFuel[f]?(metric==="vol"?d.byFuel[f].litres:d.byFuel[f].revenue):0;
        if(fv>yMax)yMax=fv;
      });
    });
  }else{
    yMax=d3.max(formatted,function(d){return d.val})||100;
  }
  if(yMax<=0)yMax=100;

  var y=d3.scaleLinear().domain([0,yMax*1.15]).range([height-margin.bottom,margin.top]);

  svg.append("g").attr("class","grid").attr("transform","translate("+margin.left+",0)")
    .call(d3.axisLeft(y).ticks(4).tickSize(-(width-margin.left-margin.right)).tickFormat(""))
    .call(function(g){g.select(".domain").remove();g.selectAll("line").attr("stroke","var(--line)").attr("stroke-opacity",0.5).attr("stroke-dasharray","3,3")});

  var xAxis=d3.axisBottom(x).ticks(Math.min(formatted.length,Math.floor(width/75))).tickFormat(d3.timeFormat("%d %b"));
  svg.append("g").attr("transform","translate(0,"+(height-margin.bottom)+")").call(xAxis)
    .call(function(g){g.select(".domain").attr("stroke","var(--line)");g.selectAll("text").attr("fill","var(--mute)").style("font-size","11px");g.selectAll("line").attr("stroke","var(--line)")});

  var yAxis=d3.axisLeft(y).ticks(4).tickFormat(function(d){
    if(metric==="rev"){
      if(d>=100000)return "₹"+(d/100000).toFixed(1)+"L";
      if(d>=1000)return "₹"+(d/1000).toFixed(0)+"k";
      return "₹"+d;
    }else{
      if(d>=1000)return (d/1000).toFixed(1)+"k L";
      return d+" L";
    }
  });
  svg.append("g").attr("transform","translate("+margin.left+",0)").call(yAxis)
    .call(function(g){g.select(".domain").remove();g.selectAll("text").attr("fill","var(--mute)").style("font-size","11px");g.selectAll("line").remove()});

  var defs=svg.append("defs");
  var grad=defs.append("linearGradient").attr("id","daily-grad").attr("x1","0%").attr("y1","0%").attr("x2","0%").attr("y2","100%");
  grad.append("stop").attr("offset","0%").attr("stop-color","#0b7a5f").attr("stop-opacity",0.35);
  grad.append("stop").attr("offset","100%").attr("stop-color","#0b7a5f").attr("stop-opacity",0.0);

  if(viewMode==="total"){
    var area=d3.area().x(function(d){return x(d.date)}).y0(y(0)).y1(function(d){return y(d.val)}).curve(d3.curveMonotoneX);
    svg.append("path").datum(formatted).attr("fill","url(#daily-grad)").attr("d",area);

    var line=d3.line().x(function(d){return x(d.date)}).y(function(d){return y(d.val)}).curve(d3.curveMonotoneX);
    svg.append("path").datum(formatted).attr("fill","none").attr("stroke","#0b7a5f").attr("stroke-width",2.5).attr("d",line);

    svg.selectAll(".dot").data(formatted).enter().append("circle")
      .attr("cx",function(d){return x(d.date)}).attr("cy",function(d){return y(d.val)})
      .attr("r",formatted.length>25?2.5:3.5).attr("fill","#fff").attr("stroke","#0b7a5f").attr("stroke-width",2);
  }else{
    fuelTypes.forEach(function(fName){
      var fColor=fuelColors[fName]||"#888";
      var fLine=d3.line().x(function(d){return x(d.date)}).y(function(d){
        var val=d.byFuel[fName]?(metric==="vol"?d.byFuel[fName].litres:d.byFuel[fName].revenue):0;
        return y(val);
      }).curve(d3.curveMonotoneX);
      svg.append("path").datum(formatted).attr("fill","none").attr("stroke",fColor).attr("stroke-width",2.2).attr("d",fLine);
      svg.selectAll(".dot-"+fName.replace(/\W/g,"")).data(formatted).enter().append("circle")
        .attr("cx",function(d){return x(d.date)}).attr("cy",function(d){
          var val=d.byFuel[fName]?(metric==="vol"?d.byFuel[fName].litres:d.byFuel[fName].revenue):0;
          return y(val);
        }).attr("r",2.5).attr("fill","#fff").attr("stroke",fColor).attr("stroke-width",1.5);
    });
  }

  var focusLine=svg.append("line").attr("stroke","var(--ink)").attr("stroke-opacity",0.4).attr("stroke-dasharray","3,3")
    .attr("y1",margin.top).attr("y2",height-margin.bottom).style("display","none");

  var bisectDate=d3.bisector(function(d){return d.date}).left;

  svg.append("rect")
    .attr("width",width-margin.left-margin.right).attr("height",height-margin.top-margin.bottom)
    .attr("transform","translate("+margin.left+","+margin.top+")").attr("fill","transparent")
    .style("cursor","crosshair")
    .on("mousemove",function(event){
      var coords=d3.pointer(event,this);
      var x0=x.invert(coords[0]+margin.left);
      var i=bisectDate(formatted,x0,1);
      var d0=formatted[i-1],d1=formatted[i],d=d0;
      if(d1&&(x0-d0.date>d1.date-x0))d=d1;
      if(!d)return;
      var cx=x(d.date);
      focusLine.attr("x1",cx).attr("x2",cx).style("display",null);
      var th='<b style="color:var(--ink)">'+d.rawDate+'</b><br/>';
      th+=(metric==="vol"?"Volume: <b>"+lt(d.val)+"</b>":"Revenue: <b>"+inr(d.val)+"</b>")+"<br/>";
      var fItems=[];
      fuelTypes.forEach(function(f){
        if(d.byFuel[f]){
          var fv=metric==="vol"?lt(d.byFuel[f].litres):inr(d.byFuel[f].revenue);
          fItems.push('<span style="color:'+fuelColors[f]+'">● '+f+': '+fv+'</span>');
        }
      });
      if(fItems.length)th+='<div style="margin-top:3px;font-size:11px">'+fItems.join("<br/>")+'</div>';
      tooltip.html(th).style("display","block")
        .style("left",Math.min(width-170,Math.max(10,cx-80))+"px")
        .style("top","10px");
    })
    .on("mouseleave",function(){
      focusLine.style("display","none");tooltip.style("display","none");
    });
}

function renderD3MonthlyChart(monthlyData,metric){
  var container=document.getElementById("d3-monthly-chart");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!monthlyData||!monthlyData.length){
    container.innerHTML='<div class="empty">No monthly sales data available.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.max(300,rect.width||520);
  var height=220;
  var margin={top:28,right:16,bottom:35,left:metric==="rev"?60:50};

  var formatted=monthlyData.map(function(m){
    var parts=m.month.split("-");
    var monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var label=monthNames[parseInt(parts[1],10)-1]+" '"+parts[0].slice(2);
    return {month:m.month,label:label,litres:m.litres||0,revenue:m.revenue||0,val:metric==="vol"?(m.litres||0):(m.revenue||0),duties:m.dutiesCount||0};
  });

  var svg=d3.select(container).append("svg")
    .attr("viewBox","0 0 "+width+" "+height).attr("width","100%").attr("height",height);
  var tooltip=d3.select(container).append("div").attr("class","chart-tooltip");

  var x=d3.scaleBand().domain(formatted.map(function(d){return d.label})).range([margin.left,width-margin.right]).padding(0.38);
  var yMax=d3.max(formatted,function(d){return d.val})||100;
  var y=d3.scaleLinear().domain([0,yMax*1.2]).range([height-margin.bottom,margin.top]);

  svg.append("g").attr("transform","translate("+margin.left+",0)")
    .call(d3.axisLeft(y).ticks(4).tickSize(-(width-margin.left-margin.right)).tickFormat(""))
    .call(function(g){g.select(".domain").remove();g.selectAll("line").attr("stroke","var(--line)").attr("stroke-opacity",0.5).attr("stroke-dasharray","3,3")});

  svg.append("g").attr("transform","translate(0,"+(height-margin.bottom)+")").call(d3.axisBottom(x))
    .call(function(g){g.select(".domain").attr("stroke","var(--line)");g.selectAll("text").attr("fill","var(--ink)").style("font-weight","600").style("font-size","12px");g.selectAll("line").remove()});

  svg.append("g").attr("transform","translate("+margin.left+",0)").call(d3.axisLeft(y).ticks(4).tickFormat(function(d){
    if(metric==="rev"){
      if(d>=100000)return "₹"+(d/100000).toFixed(1)+"L";
      return "₹"+(d/1000).toFixed(0)+"k";
    }else{
      if(d>=1000)return (d/1000).toFixed(0)+"k L";
      return d+" L";
    }
  })).call(function(g){g.select(".domain").remove();g.selectAll("text").attr("fill","var(--mute)").style("font-size","11px");g.selectAll("line").remove()});

  svg.selectAll(".bar").data(formatted).enter().append("rect").attr("class","bar")
    .attr("x",function(d){return x(d.label)}).attr("y",function(d){return y(d.val)})
    .attr("width",x.bandwidth()).attr("height",function(d){return Math.max(0,y(0)-y(d.val))})
    .attr("rx",5).attr("ry",5).attr("fill","#0b7a5f").style("cursor","pointer")
    .on("mouseenter",function(event,d){
      d3.select(this).attr("fill","#09634d");
      var th='<b>'+d.label+'</b><br/>Litres: <b>'+lt(d.litres)+'</b><br/>Revenue: <b>'+inr(d.revenue)+'</b><br/>Shifts: '+d.duties;
      tooltip.html(th).style("display","block")
        .style("left",Math.min(width-150,Math.max(10,x(d.label)-30))+"px")
        .style("top",Math.max(5,y(d.val)-50)+"px");
    })
    .on("mouseleave",function(){
      d3.select(this).attr("fill","#0b7a5f");tooltip.style("display","none");
    });

  svg.selectAll(".bar-label").data(formatted).enter().append("text")
    .attr("x",function(d){return x(d.label)+x.bandwidth()/2}).attr("y",function(d){return y(d.val)-6})
    .attr("text-anchor","middle").attr("fill","var(--ink)").style("font-size","11px").style("font-weight","600")
    .text(function(d){
      if(metric==="rev"){return d.val>=100000?"₹"+(d.val/100000).toFixed(1)+"L":"₹"+(d.val/1000).toFixed(0)+"k"}
      return d.val>=1000?(d.val/1000).toFixed(1)+"k L":d.val+" L";
    });

  if(formatted.length>1){
    var line=d3.line().x(function(d){return x(d.label)+x.bandwidth()/2}).y(function(d){return y(d.val)}).curve(d3.curveMonotoneX);
    svg.append("path").datum(formatted).attr("fill","none").attr("stroke","var(--warn)").attr("stroke-width",2).attr("stroke-dasharray","4,3").attr("d",line);
    svg.selectAll(".traj-dot").data(formatted).enter().append("circle")
      .attr("cx",function(d){return x(d.label)+x.bandwidth()/2}).attr("cy",function(d){return y(d.val)}).attr("r",3).attr("fill","var(--warn)");
  }
}

function renderD3ExpenseDonut(expenseData){
  var container=document.getElementById("d3-expense-donut");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!expenseData||!expenseData.length){
    container.innerHTML='<div class="empty">No expenses recorded in this period.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.min(360,Math.max(260,rect.width||320));
  var height=240;
  var radius=Math.min(width,height)/2-12;
  var innerRadius=radius*0.62;

  var colors=["#ef4444","#f59e0b","#3b82f6","#10b981","#8b5cf6","#ec4899","#6366f1","#14b8a6","#64748b"];
  var colorScale=d3.scaleOrdinal().range(colors);
  var totalAmt=d3.sum(expenseData,function(d){return d.amount});

  var svg=d3.select(container).append("svg")
    .attr("viewBox","0 0 "+width+" "+height).attr("width",width).attr("height",height)
    .append("g").attr("transform","translate("+(width/2)+","+(height/2)+")");

  var pie=d3.pie().value(function(d){return d.amount}).sort(null).padAngle(0.02);
  var arc=d3.arc().innerRadius(innerRadius).outerRadius(radius).cornerRadius(4);
  var arcHover=d3.arc().innerRadius(innerRadius-2).outerRadius(radius+7).cornerRadius(4);

  var centerLabel=svg.append("text").attr("text-anchor","middle").attr("dy","-4px").attr("fill","var(--ink)").style("font-size","17px").style("font-weight","800").text(inr(totalAmt));
  var centerSub=svg.append("text").attr("text-anchor","middle").attr("dy","18px").attr("fill","var(--mute)").style("font-size","11px").style("font-weight","600").text("Total Expenses");

  svg.selectAll(".slice").data(pie(expenseData)).enter().append("path").attr("class","slice")
    .attr("d",arc).attr("fill",function(d,i){return colorScale(i)}).style("cursor","pointer")
    .on("mouseenter",function(event,d){
      d3.select(this).transition().duration(150).attr("d",arcHover);
      centerLabel.text(inr(d.data.amount));
      centerSub.text(d.data.category+" ("+d.data.percentage+"%)");
    })
    .on("mouseleave",function(){
      d3.select(this).transition().duration(150).attr("d",arc);
      centerLabel.text(inr(totalAmt));
      centerSub.text("Total Expenses");
    });
}

function renderD3ExpenseBars(expenseData){
  var container=document.getElementById("d3-expense-bars");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!expenseData||!expenseData.length){
    container.innerHTML='<div class="empty">No expenses recorded in this period.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.max(300,rect.width||520);
  var barHeight=36;
  var height=expenseData.length*barHeight+30;
  var margin={top:10,right:75,bottom:20,left:110};

  var colors=["#ef4444","#f59e0b","#3b82f6","#10b981","#8b5cf6","#ec4899","#6366f1","#14b8a6","#64748b"];
  var colorScale=d3.scaleOrdinal().range(colors);
  var maxVal=d3.max(expenseData,function(d){return d.amount})||100;

  var svg=d3.select(container).append("svg")

var AUDIT_DATA=null, AUDIT_LOADING=false, AUDIT_RANGE="30", AUDIT_FROM="", AUDIT_TO="";
function getAuditFrom(){
  if(AUDIT_RANGE==="7")return dAgo(7);
  if(AUDIT_RANGE==="30")return dAgo(30);
  if(AUDIT_RANGE==="90")return dAgo(90);
  if(AUDIT_RANGE==="all")return "";
  if(AUDIT_RANGE==="custom")return AUDIT_FROM;
  return dAgo(30);
}
function getAuditTo(){
  if(AUDIT_RANGE==="all")return "";
  if(AUDIT_RANGE==="custom")return AUDIT_TO;
  return today();
}
function setAuditRange(r){
  AUDIT_RANGE=r;
  if(r!=="custom"){AUDIT_FROM="";AUDIT_TO="";}
  loadAudit(true);
}
function applyCustomAuditRange(){
  var fi=document.getElementById("auditFromInput"), ti=document.getElementById("auditToInput");
  AUDIT_FROM=fi?fi.value:""; AUDIT_TO=ti?ti.value:"";
  loadAudit(true);
}
function loadAudit(force){
  if(AUDIT_DATA&&!force){renderAudit();return}
  AUDIT_LOADING=true;renderAudit();
  var b={from:getAuditFrom(),to:getAuditTo()};
  api("POST","/api/ai-audit",b).then(function(res){
    AUDIT_DATA=res;AUDIT_LOADING=false;
    if(tab==="audit")renderAudit();
  }).catch(function(err){
    AUDIT_LOADING=false;

}

  var runTable=function(opts){

  var curY=78;

  doc.setFontSize(10.5);
  doc.setTextColor(22,38,43);
  doc.text("1. Executive Summary & Health Rating",30,curY);

    ["Diagnosis Headline",A.headline||"Operational controls active"],
    ["Settlement Accuracy",(M.reconciliationAccuracy!=null?M.reconciliationAccuracy:100)+"%"],

    });
  }else{
    riskBody.push(["LOW","General","No critical risk vulnerabilities identified in current dataset.","All normal"]);

    startY:curY+5,margin:{left:30,right:30},
    head:[["Severity","Category","Finding & Detail","Impact"]],body:riskBody,theme:"striped",
    headStyles:{fillColor:[50,75,82],textColor:255,fontSize:8.5,fontStyle:"bold"},
    styles:{fontSize:8,cellPadding:4},
    columnStyles:{
      0:{cellWidth:55,halign:"center",fontStyle:"bold"},

function doWorkerDutySubmit(){
  if(!DF||!DF.id)return;
  var errDiv=document.getElementById("confirmDutyErr");

  for(var i=0;i<(DF.lines||[]).length;i++){
    var l=DF.lines[i];
    var nn=l.name||"Nozzle";
    if(l.closing===""||l.closing==null||isNaN(parseFloat(l.closing))){
      if(errDiv)errDiv.textContent="Please enter the closing reading for "+nn+" before submitting.";
      return;
    }
    var clStr=String(l.closing).trim();
    if(clStr.indexOf('.')!==-1&&clStr.split('.')[1].length>2){
      if(errDiv)errDiv.textContent="Closing reading for "+nn+" must be up to two decimals.";
      return;
    }
    var opStr=String(l.opening).trim();
    if(opStr.indexOf('.')!==-1&&opStr.split('.')[1].length>2){
      if(errDiv)errDiv.textContent="Opening reading for "+nn+" must be up to two decimals.";
      return;
    }
    var op=parseFloat(l.opening)||0,cl=parseFloat(l.closing)||0,ts=parseFloat(l.testing)||0;
    if(cl<op){
      if(errDiv)errDiv.textContent="Closing reading ("+cl.toFixed(2)+") is less than opening reading ("+op.toFixed(2)+") for "+nn+".";
      return;
    }
    if(ts>(cl-op)){
      if(errDiv)errDiv.textContent="Testing litres ("+ts.toFixed(2)+") exceed fuel dispensed ("+(cl-op).toFixed(2)+") for "+nn+".";
      return;
    }
  }

  var btn=document.getElementById("btnConfirmSubmit");
  if(btn){
    btn.disabled=true;
    btn.textContent="Submitting...";
  }

  if(autoSaveTimer){clearTimeout(autoSaveTimer);autoSaveTimer=null;}
  autoSavePending=false;

  api("POST","/api/duty/"+DF.id+"/submit",dpay()).then(function(){
    try{localStorage.removeItem("petrol_duty_draft_"+DF.id);}catch(e){}
    setAutoSaveStatus("","");
    closeM();
    toast("Duty submitted to manager successfully!");
    loadW();
  }).catch(function(e){
    if(btn){
      btn.disabled=false;
      btn.textContent="Confirm & Submit duty";
    }
    if(errDiv)errDiv.textContent=e.error||"Could not submit duty. Check your connection.";
    else toast(e.error||"Could not submit duty.");
  });
}

function doWorkerAssign(){

  var shift=v("wa_shift");

  var selects=document.querySelectorAll(".wa_nozzle_worker");

  if(selects.length>0){
    for(var i=0;i<selects.length;i++){
      var s=selects[i];
      if(s.disabled)continue;
      var nId=s.getAttribute("data-nozzle-id");
      var wId=s.value;
      if(!wId){
