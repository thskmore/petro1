<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Petrol Pump Manager</title>
<meta name="description" content="Full-stack petrol pump management system with shift duties, nozzle readings, credit ledger, invoices, stock, tank dips, and payroll.">
<meta property="og:title" content="Petrol Pump Manager">
<meta property="og:description" content="Full-stack petrol pump management system with shift duties, nozzle readings, credit ledger, invoices, stock, tank dips, and payroll.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ef;--card:#fff;--ink:#16262b;--mute:#5d6e72;--line:#d5dcda;--due:#b8321f;--ok:#0b7a5f;--warn:#b86e00;--btn:#16262b;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a1d;--card:#1a272b;--ink:#e8efed;--mute:#97a8ab;--line:#2c3c41;--due:#ff7b66;--ok:#4fd1a5;--warn:#f0b050;--btn:#e8efed;--btnt:#111a1d}}
:root[data-theme="dark"]{--bg:#111a1d;--card:#1a272b;--ink:#e8efed;--mute:#97a8ab;--line:#2c3c41;--due:#ff7b66;--ok:#4fd1a5;--warn:#f0b050;--btn:#e8efed;--btnt:#111a1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Hanken Grotesk",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0}
.total{font-size:44px;font-weight:800;letter-spacing:-1px;color:var(--due);margin:2px 0 14px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
button{font:600 15px inherit;font-family:inherit;border:0;border-radius:8px;padding:11px 14px;background:var(--btn);color:var(--btnt);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.cust{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-top:10px;cursor:pointer}
.cust b{font-size:17px}.amt{font-weight:800;font-size:18px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.sub{font-size:13px;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}
.sale{color:var(--due)}.pay{color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
#sheet h2{margin:0 0 4px;font-size:19px}
.err{color:var(--due);font-size:13px;margin-top:8px;min-height:18px}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}
@media print{.noprint,button{display:none!important}body{background:#fff;color:#000}}
#bdg{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:var(--due);color:#fff;padding:8px 12px;font-size:14px;z-index:9;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="bdg"></div>
<div class="wrap" id="app"></div>
<div id="modal"><div id="sheet"></div></div>
<script>
function emptyS(){return{c:[],inv:[],items:[],sup:[],bk:[],nozzles:[],tanks:[],deliv:[],rates:[],expcats:[],paymodes:[],ob:{Cash:0,Bank:0,UPI:0},biz:{name:"",addr:"",gst:""}}}
var KEY="petrol-credit-ledger-v1",S=emptyS(),view=null,from="",to="",onlyDue=false,cb,tab="ledger",dr=null,iv=null,sv=null,bf="all",rf=today().slice(0,8)+"01",rt=today();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
var d=function(n){return new Date(Date.now()-n*864e5).toISOString().slice(0,10)};
return{c:[
{id:1,name:"Shree Transport",phone:"9876500011",gst:"27ABCDE1234F1Z5",veh:["MH12 AB 1234","MH12 CD 5678"],limit:50000,e:[{d:d(9),t:"sale",n:"HSD 300 L",a:28500},{d:d(5),t:"pay",n:"UPI",a:10000},{d:d(2),t:"sale",n:"HSD 150 L",a:14250}]},
{id:2,name:"Patil Agro Services",phone:"9876500022",gst:"",veh:["MH14 XY 9090"],limit:20000,e:[{d:d(6),t:"sale",n:"MS 100 L",a:10800},{d:d(3),t:"sale",n:"Power MS 60 L",a:7100}]},
{id:3,name:"City Cab Fleet",phone:"9876500033",gst:"27PQRST5678G1Z2",veh:[],limit:30000,e:[{d:d(4),t:"sale",n:"MS 200 L",a:21600},{d:d(1),t:"pay",n:"Cash",a:21600}]}]}}
function save(){if(!SRV){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}clearTimeout(saveT);saveT=setTimeout(push,400)}
function due(c){if(!c||!c.e)return 0;return c.e.reduce(function(s,x){return s+(x.t=="sale"?x.a:-x.a)},0)}
function inr(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function find(id){if(!S||!S.c)return null;return S.c.filter(function(c){return c.id==id})[0]}
function render(){if(!S)S=emptyS();if(!S.c)S.c=[];if(SRV&&!ME)return;if(tab=="inv")return renderInv();if(tab=="stock")return renderStock();if(tab=="sup")return renderSup();if(tab=="book")return renderBook();if(tab=="rep")return renderRep();if(tab=="bak"){tab="setup";SU="bak";return renderSetup();}if(tab=="team"){tab="setup";SU="team";return renderSetup();}if(tab=="credit")return renderCredit();if(tab=="duty")return renderDutyTab();if(tab=="tanks")return renderTanks();if(tab=="wdip")return loadDip();if(tab=="pay")return renderSalary();if(tab=="setup")return renderSetup();if(tab=="mypay")return loadMyPay();if(tab=="wduty")return loadW();var h="";
if(!view){var tot=S.c.reduce(function(s,c){return s+due(c)},0),q=(document.getElementById("q")||{}).value||"";
h+=nav()+pendHtml()+'<h1>Total credit outstanding</h1><div class="total">'+inr(tot)+'</div><div class="row"><input id="q" placeholder="Search name or vehicle" value="'+esc(q)+'" oninput="render();var i=document.getElementById(\'q\');i.focus();i.setSelectionRange(99,99)"><button onclick="custForm()">Add customer</button></div><button class="ghost" style="width:100%;margin-top:8px" onclick="bulkForm()">Send reminders to everyone with dues</button><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" '+(onlyDue?'checked':'')+' onchange="onlyDue=this.checked;render()">Only customers with dues</label>';
var l=S.c.filter(function(c){var t=(c.name+c.veh.join(" ")).toLowerCase();return t.indexOf(q.toLowerCase())>-1&&(!onlyDue||due(c)>0)});
if(!l.length)h+='<div class="empty">No credit customers found. Add one to start a ledger.</div>';
l.forEach(function(c){var d=due(c),p=c.limit?Math.min(100,d/c.limit*100):0;
h+='<div class="cust" tabindex="0"'+(c.active===false?' style="opacity:.6"':'')+' onclick="view='+c.id+';render()" onkeydown="if(event.key==\'Enter\'){view='+c.id+';render()}"><div class="row"><b>'+esc(c.name)+(c.active===false?' (inactive)':'')+'</b><span class="amt" style="text-align:right;flex:none;color:'+(d>0?'var(--due)':'var(--ok)')+'">'+inr(d)+'</span></div><div class="sub">'+(c.veh.length?esc(c.veh.join(", ")):"No vehicles added")+'</div><div class="bar"><i style="width:'+p+'%;background:'+(p>=90?'var(--due)':p>=70?'var(--warn)':'var(--ok)')+'"></i></div><div class="sub" style="margin-top:4px">'+Math.round(p)+'% of '+inr(c.limit)+' limit used</div></div>'}
)}else{var c=find(view),d=due(c),bal=0;
h+='<button class="ghost noprint" onclick="view=null;render()">Back to customers</button><h1 style="margin-top:14px">'+esc(c.name)+'</h1><div class="total">'+inr(d)+'</div><div class="sub">Limit '+inr(c.limit)+' · Available '+inr(Math.max(0,c.limit-d))+'</div><div class="sub">'+esc(c.phone)+(c.gst?' · GST '+esc(c.gst):'')+'</div><div class="sub">Vehicles: '+(c.veh.length?esc(c.veh.join(", ")):"none added")+'</div>'+
'<div class="btns noprint"><button onclick="entryForm(\'sale\')">Add credit sale</button><button onclick="entryForm(\'pay\')">Receive payment</button><button class="ghost" onclick="remind()">Send WhatsApp reminder</button><button class="ghost" onclick="custForm('+c.id+')">Edit details</button><button class="ghost" onclick="window.print()">Print statement</button><button class="ghost" onclick="stmt()">Share statement</button></div>';
h+=ageing(c)+'<div class="row noprint"><label>From<input type="date" value="'+from+'" onchange="from=this.value;render()"></label><label>To<input type="date" value="'+to+'" onchange="to=this.value;render()"></label></div>';
h+='<div class="tbl" style="margin-top:12px"><table><tr><th>Date</th><th>Detail</th><th class="r">Amount</th><th class="r">Balance</th><th class="noprint"></th></tr>';var n=0;
rows(c).forEach(function(o){var x=o.x;if(o.skip)return;n++;
h+='<tr><td>'+x.d.slice(5)+'</td><td>'+(x.t=="sale"?"Sale: ":"Paid: ")+esc(x.n)+'</td><td class="r '+x.t+'">'+(x.t=="sale"?"+":"\u2212")+inr(x.a)+'</td><td class="r">'+inr(o.bal)+'</td><td class="noprint" style="white-space:nowrap">'+(x.srv?'':'<button class="ghost" style="padding:5px 8px" onclick="entryForm(\''+x.t+'\','+o.i+')">Edit</button> ')+'<button class="ghost" style="padding:5px 8px" onclick="delEntry('+o.i+')">Delete</button></td></tr>'});
if(!n)h+='<tr><td colspan="5" class="empty">No entries in this range.</td></tr>';
h+='</table></div>'}
document.getElementById("app").innerHTML=h}
function openM(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("on")}
function closeM(){document.getElementById("modal").classList.remove("on")}
function close(){closeM()}
window.closeM=closeM;
document.getElementById("modal").onclick=function(e){if(e.target.id=="modal")closeM()};
function v(id){return document.getElementById(id).value.trim()}
function custForm(id){var c=id?find(id):{name:"",phone:"",gst:"",veh:[],limit:""};
openM('<h2>'+(id?'Edit customer':'Add credit customer')+'</h2><label>Name<input id="f1" value="'+esc(c.name)+'"></label><label>Phone (WhatsApp)<input id="f2" inputmode="tel" value="'+esc(c.phone)+'"></label><label>GST number (optional)<input id="f3" value="'+esc(c.gst)+'"></label><label>Vehicle numbers, separated by commas<input id="f4" value="'+esc(c.veh.join(", "))+'"></label><label>Credit limit (₹)<input id="f5" inputmode="numeric" value="'+esc(c.limit)+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="closeM()">Cancel</button><button onclick="saveCust('+(id||0)+')">Save customer</button></div>')}
function saveCust(id){var n=v("f1"),p=v("f2").replace(/\D/g,""),l=parseFloat(v("f5"));
if(!n)return er("Enter the customer name.");if(p.length<10)return er("Enter a 10-digit phone number.");if(!(l>0))return er("Enter a credit limit above zero.");
var o={name:n,phone:p,gst:v("f3").toUpperCase(),veh:v("f4").split(",").map(function(s){return s.trim().toUpperCase()}).filter(Boolean),limit:l};
if(id){Object.assign(find(id),o)}else{o.id=Date.now();o.e=[];S.c.push(o)}save();closeM();render()}
function er(m){document.getElementById("er").textContent=m}
function rows(c){var bal=0;return c.e.map(function(x,i){return{x:x,i:i}}).sort(function(p,q){return p.x.d<q.x.d?-1:1}).map(function(o){bal+=o.x.t=="sale"?o.x.a:-o.x.a;o.bal=bal;o.skip=(from&&o.x.d<from)||(to&&o.x.d>to);return o})}
function ageing(c){var paid=c.e.reduce(function(s,x){return s+(x.t=="pay"?x.a:0)},0),k=[0,0,0,0],now=Date.now(),L=["0-30 days","31-60","61-90","90+"];
c.e.filter(function(x){return x.t=="sale"}).sort(function(p,q){return p.d<q.d?-1:1}).forEach(function(x){var r=x.a,u=Math.min(paid,r);paid-=u;r-=u;if(r>0){var dy=Math.floor((now-new Date(x.d))/864e5);k[dy<=30?0:dy<=60?1:dy<=90?2:3]+=r}});
return '<div class="sub" style="margin-top:12px">Overdue ageing</div><div class="row" style="gap:6px">'+k.map(function(v,i){return '<div class="cust" style="margin:4px 0 0;padding:8px;cursor:default;text-align:center"><div class="sub">'+L[i]+'</div><b style="color:'+(i>1&&v>0?'var(--due)':'var(--ink)')+'">'+inr(v)+'</b></div>'}).join("")+'</div>'}
function ask(m,fn){cb=fn;openM('<h2>Please confirm</h2><div class="sub">'+esc(m)+'</div><div class="row" style="margin-top:14px"><button class="ghost" onclick="closeM()">Cancel</button><button id="btnAskConfirm" onclick="doAskConfirm()">Yes, continue</button></div>')}
function doAskConfirm(){closeM();if(typeof cb==="function"){var f=cb;cb=null;f();}}
function entryForm(t,i){var c=find(view),s=t=="sale",x=i!=null?c.e[i]:null;
openM('<h2>'+(x?'Edit ':'Add ')+(s?'credit sale':'payment')+'</h2><div class="sub">'+esc(c.name)+' \u00b7 Due '+inr(due(c))+'</div><label>Date<input id="f1" type="date" value="'+(x?x.d:today())+'"></label><label>'+(s?'Fuel / item and quantity<input id="f2" value="'+esc(x?x.n:"")+'" placeholder="e.g. HSD 200 L">':'Mode<select id="f2"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Cheque</option></select>')+'</label><label>Amount (\u20b9)<input id="f3" inputmode="decimal" value="'+(x?x.a:"")+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveEntry(\''+t+'\','+(i==null?'null':i)+')">Save</button></div>');
if(x&&!s)document.getElementById("f2").value=x.n}
function saveEntry(t,i){var c=find(view),a=parseFloat(v("f3")),old=i!=null?c.e[i]:null,cur=due(c)-(old?(old.t=="sale"?old.a:-old.a):0);
if(!(a>0))return er("Enter an amount above zero.");if(!v("f2"))return er("Enter the item and quantity.");
var o={d:v("f1"),t:t,n:v("f2"),a:a};
function go(){if(old)c.e[i]=o;else c.e.push(o);save();close();render()}
if(t=="sale"&&cur+a>c.limit)return ask("This sale takes "+c.name+" over the credit limit by "+inr(cur+a-c.limit)+". Save anyway?",go);
if(t=="pay"&&a>cur)return ask("Payment is more than the amount due. Save anyway?",go);go()}
function delEntry(i){var c=find(view),x=c.e[i];ask("Delete the "+(x.t=="sale"?"sale":"payment")+" of "+inr(x.a)+" ("+x.n+")?",function(){if(x.srv){var ep=String(x.srv).indexOf("rec_")===0?("/api/credit-recoveries/"+x.srv.slice(4)):("/api/credit-sales/"+x.srv);api("DELETE",ep).then(function(){pullDuty(render)}).catch(function(e){badge(e.error||"Could not delete.")});return}c.e.splice(i,1);save();render()})}
function stmt(){var c=find(view),t="Statement for "+c.name+(from||to?" ("+(from||"start")+" to "+(to||"today")+")":"")+"\n";
rows(c).forEach(function(o){if(!o.skip)t+=o.x.d+" "+(o.x.t=="sale"?"Sale ":"Paid ")+o.x.n+" "+(o.x.t=="sale"?"+":"-")+Math.round(o.x.a)+" | Bal "+Math.round(o.bal)+"\n"});
t+="Total outstanding: "+inr(due(c));window.open("https://wa.me/91"+c.phone.slice(-10)+"?text="+encodeURIComponent(t),"_blank")}
function remind(){var c=find(view),d=due(c);
if(d<=0)return openM('<h2>No dues</h2><div class="sub">'+esc(c.name)+' has nothing outstanding.</div><div class="btns"><button onclick="close()">Close</button></div>');
var m="Dear "+c.name+", your outstanding credit balance at our petrol pump is "+inr(d)+". Please clear it at your earliest convenience. Thank you.";
openM('<h2>Reminder message</h2><label>Message<input id="f1" value="'+esc(m)+'"></label><div class="row" style="margin-top:14px"><button class="ghost" onclick="close()">Cancel</button><button onclick="window.open(\'https://wa.me/91'+c.phone.slice(-10)+'?text=\'+encodeURIComponent(v(\'f1\')),\'_blank\')">Open WhatsApp</button></div>')}
function r2(n){return Math.round(n*100)/100}
function m2(n){return "\u20b9"+n.toFixed(2)}
function tax(ls,ig){var t=r2(ls.reduce(function(s,l){return s+l.q*l.r},0)),x=r2(t*.18),tot=Math.round(t+x);return{t:t,x:x,tot:tot,ro:r2(tot-t-x),ig:ig}}
function igstFor(g){return !!(S.biz.gst&&g&&S.biz.gst.slice(0,2)!=g.slice(0,2))}
function curG(){return dr.cust!="0"?find(dr.cust).gst:dr.wgst}
function nav(){var T=[["ledger","Ledger"],["inv","Invoices"],["stock","Stock"],["sup","Suppliers"],["book","Book"],["rep","Reports"]];if(SRV)T.splice(1,0,["duty","Duty"],["tanks","Tanks"]);if(SRV&&ME&&(ME.role=="owner"||ME.role=="manager"))T.push(["setup","Pump setup"]);if(SRV&&ME&&ME.role=="owner")T.push(["pay","Salary"]);return ubar()+'<div class="noprint" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px">'+T.map(function(t){return '<button style="padding:10px 0;font-size:13px;min-width:0" class="'+(tab==t[0]?'':'ghost')+'" onclick="tab=\''+t[0]+'\';view=null;iv=null;dr=null;sv=null;render()">'+t[1]+'</button>'}).join("")+'</div>'}
function renderInv(){var h=nav();
if(dr)h+=draftHtml();else if(iv)h+=invHtml(iv);else{
h+='<h1>GST invoices for lubricants and shop items</h1><div class="btns"><button onclick="newInv()">New invoice</button></div>';
if(!S.inv.length)h+='<div class="empty">No invoices yet. Create one for a lubricant or shop sale.</div>';
S.inv.slice().reverse().forEach(function(i){h+='<div class="cust" tabindex="0" onclick="iv='+i.id+';renderInv()"><div class="row"><b>'+esc(i.no)+'</b><span class="amt" style="flex:none">'+m2(i.total)+'</span></div><div class="sub">'+esc(i.name)+' \u00b7 '+i.d+' \u00b7 '+(i.mode=="credit"?"On credit":esc(i.mode))+'</div></div>'})}
document.getElementById("app").innerHTML=h}
function newInv(){if(!S.biz.name||S.biz.gst.length!=15){bizForm(true);return}dr={cust:"0",wname:"",wgst:"",lines:[{n:"",q:1,r:""}],mode:"Cash"};renderInv()}
function bizForm(go){var b=S.biz;openM('<h2>Business details</h2><div class="sub">Shown on every invoice</div><label>Pump name<input id="f1" value="'+esc(b.name)+'"></label><label>Address<input id="f2" value="'+esc(b.addr)+'"></label><label>GSTIN (15 characters)<input id="f3" value="'+esc(b.gst)+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveBiz('+(go?1:0)+')">Save details</button></div>')}
function saveBiz(go){var g=v("f3").toUpperCase();if(!v("f1"))return er("Enter the pump name.");if(g.length!=15)return er("GSTIN must be 15 characters.");S.biz={name:v("f1"),addr:v("f2"),gst:g};save();close();if(go)newInv();else renderInv()}
function draftHtml(){var h='<h1>New invoice</h1><label>Customer<select onchange="dr.cust=this.value;dr.mode=\'Cash\';renderInv()"><option value="0">Walk-in customer</option>'+S.c.filter(function(c){return c.active!==false}).map(function(c){return '<option value="'+c.id+'"'+(dr.cust==c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join("")+'</select></label>';
if(dr.cust=="0")h+='<label>Name (optional)<input value="'+esc(dr.wname)+'" oninput="dr.wname=this.value"></label><label>Customer GSTIN (optional)<input value="'+esc(dr.wgst)+'" oninput="dr.wgst=this.value.toUpperCase();upd()"></label>';
h+='<label style="margin-top:16px">Items (rate excludes GST)</label>';

function getTanksStockList(){

    TK_STOCK_CACHE.forEach(function(c){cacheMap[String(c.id)]=c});
  }
  return (S.tanks||[]).map(function(t){
    var c=cacheMap[String(t.id)];
    if(c){
      return Object.assign({},c,{name:t.name,fuel:t.fuel,capacity:t.capacity||c.capacity});
    }
    return {id:t.id,name:t.name,fuel:t.fuel,capacity:t.capacity||0,book:null,last:null,checks:[]};
  });
}

var obj={id:d.id,mode:mode,modes:ctx.modes,cats:ctx.cats,stock:ctx.items,lines:d.lines.map(function(l){return{nozzle_id:l.nozzle_id,name:l.nozzle,fuel:l.fuel,opening:l.opening==null?"":l.opening,closing:l.closing==null?"":l.closing,testing:l.testing||0,rate:l.rate==null?"":l.rate}}),items:d.items.map(function(i){return{item_id:i.item_id,qty:i.qty}}),exps:d.expenses.map(function(e){return{cat:e.cat,note:e.note,amount:e.amount}}),pay:pay,note:d.note||"",credit:d.credit||0,credits:d.credit_sales||[],recovery:d.recovery||0,recoveries:d.credit_recoveries||[],meta:d,slips:slips,cash_denoms:cash_denoms};
try{var raw=localStorage.getItem("petrol_duty_draft_"+d.id);if(raw){var dr=JSON.parse(raw);if(dr&&dr.lines){dr.lines.forEach(function(dl){var tg=obj.lines.find(function(l){return String(l.nozzle_id)===String(dl.nozzle_id)});if(tg&&tg.closing===""&&dl.closing!==""&&dl.closing!=null){tg.closing=dl.closing;if(dl.testing!=null)tg.testing=dl.testing}})}if(dr&&dr.note&&!obj.note)obj.note=dr.note}}catch(e){}
return obj}
function dpay(){var payCopy={};Object.keys(DF.pay||{}).forEach(function(k){if(k[0]!=="_")payCopy[k]=DF.pay[k]});if(DF.slips)payCopy._slips=DF.slips;if(DF.cash_denoms)payCopy._denoms=DF.cash_denoms;return{lines:DF.lines.map(function(l){return{nozzle_id:l.nozzle_id,opening:l.opening,closing:l.closing,testing:l.testing,rate:l.rate}}),items:DF.items,expenses:DF.exps,pay:payCopy,note:DF.note,recoveries:DF.recoveries||[]}}

document.getElementById("app").innerHTML=h}
function confirmDutyModal(){
  if(!DF)return;
  var m=DF.meta||{};
  var mn={};
  (DF.modes||[]).forEach(function(mode){mn[mode.key]=mode.name;});

  var totLitres=0,totFuelSales=0;
  var missingClosing=[];
  var invalidNozzles=[];

  var lineRows=(DF.lines||[]).map(function(l){
    var hasClosing=l.closing!==""&&l.closing!=null&&!isNaN(parseFloat(l.closing));
    var op=fnum(l.opening),cl=hasClosing?fnum(l.closing):0,ts=fnum(l.testing),r=fnum(l.rate);
    var nn=l.name||"Nozzle";
    if(!hasClosing){
      missingClosing.push(nn);
    }else{
      if(cl<op)invalidNozzles.push(nn+": Closing ("+cl+") is less than Opening ("+op+")");
      if(ts>(cl-op))invalidNozzles.push(nn+": Testing ("+ts+" L) exceeds dispensed ("+(cl-op)+" L)");
    }
    var lt=hasClosing?Math.round((cl-op-ts)*100)/100:0;
    var amt=hasClosing?Math.round(lt*r*100)/100:0;
    if(hasClosing){totLitres+=lt;totFuelSales+=amt;}
    return{
      name:nn,
      fuel:l.fuel||"",
      opening:l.opening===""?"-":l.opening,
      closing:hasClosing?l.closing:'<span style="color:var(--due);font-weight:700">Not entered</span>',
      testing:ts,
      litres:hasClosing?(lt+" L"):"-",
      rate:r>0?(m2(r)+"/L"):'<span style="color:var(--warn)">No rate</span>',
      amount:hasClosing?m2(amt):"-"
    };
  });
  totLitres=Math.round(totLitres*100)/100;
  totFuelSales=Math.round(totFuelSales*100)/100;

  var totLube=0;
  var lubeRows=[];
  (DF.items||[]).forEach(function(it){
    var s=(DF.stock||[]).find(function(x){return String(x.id)===String(it.item_id);});
    var qty=fnum(it.qty);
    if(qty>0){
      var price=s?s.sell:0;
      var amt=Math.round(qty*price*100)/100;
      totLube+=amt;
      lubeRows.push({name:s?s.name:"Item",qty:qty+" "+(s?s.unit:"pc"),price:m2(price),amount:m2(amt)});
    }
  });
  totLube=Math.round(totLube*100)/100;

  var totExp=0;
  (DF.exps||[]).forEach(function(x){totExp+=fnum(x.amount);});
  totExp=Math.round(totExp*100)/100;

  var totCredit=0;
  (DF.credits||[]).forEach(function(x){if(x.status!=="rejected")totCredit+=fnum(x.a);});
  totCredit=Math.round(totCredit*100)/100;

  var totRec=0;
  (DF.recoveries||[]).forEach(function(x){totRec+=fnum(x.a);});
  totRec=Math.round(totRec*100)/100;

  var expected=Math.round((totFuelSales+totLube+totRec-totCredit-totExp)*100)/100;

  var totCollected=0;
  var payRows=[];
  (DF.modes||[]).forEach(function(mode){
    var amt=fnum(DF.pay?DF.pay[mode.key]:0);
    totCollected+=amt;
    payRows.push({name:mode.name,amount:m2(amt)});
  });
  totCollected=Math.round(totCollected*100)/100;
  var diff=Math.round((totCollected-expected)*100)/100;

  var h='<h2>Please confirm</h2>'
    +'<div class="sub" style="margin-bottom:12px">All shift details are shown below. Please review carefully before submitting to your manager.</div>';

  if(missingClosing.length){
    h+='<div class="cust" style="background:#fff3cd;border-color:#ffeeba;color:#856404;margin-bottom:12px;padding:10px 12px;cursor:default">'
      +'⚠️ <b>Missing closing reading:</b> '+esc(missingClosing.join(", "))+'. Enter closing readings before submitting.'
      +'</div>';
  }
  if(invalidNozzles.length){
    h+='<div class="cust" style="background:#f8d7da;border-color:#f5c6cb;color:#721c24;margin-bottom:12px;padding:10px 12px;cursor:default">'
      +'⚠️ <b>Readings error:</b><br>'+invalidNozzles.map(esc).join("<br>")
      +'</div>';
  }

  h+='<div class="cust" style="cursor:default;margin-bottom:12px;padding:12px">'
    +'<div class="row"><b>'+esc(m.shift||"Shift")+' duty</b><span class="sub" style="flex:none"><b>'+esc(m.d||today())+'</b></span></div>'
    +'<div class="sub" style="margin-top:2px">Worker: '+esc(ME?ME.name:"Worker")+'</div>'
    +'</div>';

  h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Nozzle readings</div>';
  h+='<div class="tbl" style="margin-bottom:12px"><table>'
    +'<tr><th>Nozzle</th><th class="r">Open</th><th class="r">Close</th><th class="r">Test</th><th class="r">Litres</th><th class="r">Rate</th><th class="r">Amount</th></tr>';
  lineRows.forEach(function(l){
    h+='<tr><td>'+esc(l.name)+'<div class="sub">'+esc(l.fuel)+'</div></td>'
      +'<td class="r">'+l.opening+'</td>'
      +'<td class="r">'+l.closing+'</td>'
      +'<td class="r">'+l.testing+'</td>'
      +'<td class="r"><b>'+l.litres+'</b></td>'
      +'<td class="r">'+l.rate+'</td>'
      +'<td class="r"><b>'+l.amount+'</b></td></tr>';
  });
  h+='<tr><td colspan="4"><b>Total fuel sales</b></td><td class="r"><b>'+totLitres+' L</b></td><td></td><td class="r"><b>'+inr(totFuelSales)+'</b></td></tr>';
  h+='</table></div>';

  if(lubeRows.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Lubes & shop items sold</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>';
    lubeRows.forEach(function(r){
      h+='<tr><td>'+esc(r.name)+'</td><td class="r">'+esc(r.qty)+'</td><td class="r">'+r.price+'</td><td class="r"><b>'+r.amount+'</b></td></tr>';
    });
    h+='<tr><td colspan="3"><b>Total lubes/shop</b></td><td class="r"><b>'+inr(totLube)+'</b></td></tr>';
    h+='</table></div>';
  }

  if(DF.recoveries&&DF.recoveries.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Credit recovery collections</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Customer</th><th>Mode</th><th class="r">Amount</th></tr>';
    DF.recoveries.forEach(function(r){
      h+='<tr><td>'+esc(r.cname||"Customer")+(r.note?'<div class="sub">'+esc(r.note)+'</div>':'')+'</td><td>'+esc(r.mode||"Cash")+'</td><td class="r pay"><b>+'+inr(fnum(r.a))+'</b></td></tr>';
    });
    h+='<tr><td colspan="2"><b>Total recovery</b></td><td class="r pay"><b>+'+inr(totRec)+'</b></td></tr>';
    h+='</table></div>';
  }

  if(DF.credits&&DF.credits.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Credit sales given</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Customer</th><th>Detail</th><th class="r">Amount</th></tr>';
    DF.credits.forEach(function(c){
      h+='<tr><td>'+esc(c.cname||"Customer")+'</td><td>'+esc(c.n||"")+(c.veh?' · '+esc(c.veh):'')+'</td><td class="r"><b>'+inr(fnum(c.a))+'</b></td></tr>';
    });
    h+='<tr><td colspan="2"><b>Total credit sales</b></td><td class="r"><b>'+inr(totCredit)+'</b></td></tr>';
    h+='</table></div>';
  }

  if(DF.exps&&DF.exps.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Expenses paid from till</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Category</th><th>Detail</th><th class="r">Amount</th></tr>';
    DF.exps.forEach(function(e){
      h+='<tr><td>'+esc(e.cat)+'</td><td>'+esc(e.note||"No detail")+'</td><td class="r"><b>'+inr(fnum(e.amount))+'</b></td></tr>';
    });
    h+='<tr><td colspan="2"><b>Total expenses</b></td><td class="r"><b>'+inr(totExp)+'</b></td></tr>';
    h+='</table></div>';
  }

  var T=function(a,b,col){return '<tr><td>'+a+'</td><td class="r"'+(col?' style="color:'+col+'"':'')+'>'+b+'</td></tr>';};
  h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Collection and difference</div>';
  h+='<div class="tbl" style="margin-bottom:12px"><table>';
  h+=T("Fuel sales",inr(totFuelSales));
  if(totLube>0)h+=T("Lube and shop sales",inr(totLube));
  if(totRec>0)h+=T("Credit recovery collections","+"+inr(totRec),"var(--ok)");
  if(totCredit>0)h+=T("Less credit sales","−"+inr(totCredit));
  if(totExp>0)h+=T("Less expenses","−"+inr(totExp));
  h+=T("<b>Expected collection</b>","<b>"+inr(expected)+"</b>");
  payRows.forEach(function(p){
    h+=T(esc(p.name),p.amount);
  });
  h+=T("<b>Total collected</b>","<b>"+inr(totCollected)+"</b>");
  h+=T("<b>Difference</b>","<b>"+sgn(diff)+"</b>",Math.abs(diff)<1?'var(--ok)':'var(--due)');
  h+='</table></div>';

  if(DF.note){
    h+='<div class="sub" style="margin-bottom:10px"><b>Note:</b> '+esc(DF.note)+'</div>';
  }

  h+='<div class="err" id="confirmDutyErr" style="font-weight:600;font-size:14px;margin-bottom:8px"></div>';

  h+='<div class="row" style="margin-top:14px;gap:8px">'
    +'<button class="ghost" onclick="closeM()" style="flex:1">Go back & edit</button>'
    +'<button id="btnConfirmSubmit" onclick="doWorkerDutySubmit()" style="flex:1.4">Confirm & Submit duty</button>'
    +'</div>';

  openM(h);
}

function doWorkerDutySubmit(){
  if(!DF||!DF.id)return;
  var errDiv=document.getElementById("confirmDutyErr");

  for(var i=0;i<(DF.lines||[]).length;i++){
    var l=DF.lines[i];
    var nn=l.name||"Nozzle";
    if(l.closing===""||l.closing==null||isNaN(parseFloat(l.closing))){
      if(errDiv)errDiv.textContent="Please enter the closing reading for "+nn+" before submitting.";
      return;
    }
    var op=parseFloat(l.opening)||0,cl=parseFloat(l.closing)||0,ts=parseFloat(l.testing)||0;
    if(cl<op){
      if(errDiv)errDiv.textContent="Closing reading ("+cl+") is less than opening reading ("+op+") for "+nn+".";
      return;
    }
    if(ts>(cl-op)){
      if(errDiv)errDiv.textContent="Testing litres ("+ts+") exceed fuel dispensed ("+(cl-op)+") for "+nn+".";
      return;
    }
  }

  var btn=document.getElementById("btnConfirmSubmit");
  if(btn){
    btn.disabled=true;
    btn.textContent="Submitting...";
  }

  if(autoSaveTimer){clearTimeout(autoSaveTimer);autoSaveTimer=null;}
  autoSavePending=false;

  api("POST","/api/duty/"+DF.id+"/submit",dpay()).then(function(){
    try{localStorage.removeItem("petrol_duty_draft_"+DF.id);}catch(e){}
    setAutoSaveStatus("","");
    closeM();
    toast("Duty submitted to manager successfully!");
    loadW();
  }).catch(function(e){
    if(btn){
      btn.disabled=false;
      btn.textContent="Confirm & Submit duty";
    }
    if(errDiv)errDiv.textContent=e.error||"Could not submit duty. Check your connection.";
    else toast(e.error||"Could not submit duty.");
  });
}

function renderWAssign(r){
  if(r)WORKER_ASSIGN_DATA=r;
  else r=WORKER_ASSIGN_DATA;
  if(!r)return;

  var h=ubar()+wnav()+'<button class="ghost noprint" onclick="tab=\'wduty\';loadW()" style="margin-bottom:12px">← Back to My duty</button><h1>Assign / Handover duty</h1>';
  if(r.has_open){
    h+='<div class="cust" style="cursor:default;padding:14px">'
      +'<div class="row"><b style="color:var(--ok)">Active duty in progress</b><span class="sub" style="flex:none">'+esc(r.duty.shift)+' · '+esc(r.duty.d)+'</span></div>'
      +'<div class="sub" style="margin-top:6px">You already have an open duty in progress. Complete and submit it before assigning or handing over the next shift.</div>'
      +'<div class="btns" style="margin:12px 0 0"><button onclick="tab=\'wduty\';loadW()">Go to active duty</button></div>'
      +'</div>';
    document.getElementById("app").innerHTML=h;
    return;
  }
  if(!r.latest_closed){
    h+='<div class="empty">No closed duty found to assign from. Your manager must assign your first duty. Once completed and closed, you can assign future shifts here.</div>';
    document.getElementById("app").innerHTML=h;
    return;
  }
  var lc=r.latest_closed;
  var nextShift="Morning";
  if(lc.shift=="Morning")nextShift="Evening";

function doWorkerAssign(){
  var btn=document.getElementById("btnDoAssign");
  var errDiv=document.getElementById("waErr");
  var isHandover=(WORKER_ASSIGN_MODE==="handover");
  var targetWorkerId=isHandover?v("wa_target_worker"):null;
  var note=isHandover?v("wa_note"):"";
  var shift=v("wa_shift");

  if(isHandover&&!targetWorkerId){
    if(errDiv)errDiv.textContent="Please select a worker to hand over the duty to.";
    return;
  }

  if(btn){
    btn.disabled=true;
    btn.textContent=isHandover?"Handing over duty...":"Assigning duty...";
  }

  var payload={shift:shift};
  if(isHandover){
    payload.target_worker_id=targetWorkerId;
    payload.note=note;
  }

  api("POST","/api/worker/assign-duty",payload).then(function(res){
    if(isHandover){
      toast("Duty handed over to "+(res.target_name||"worker")+" successfully!");
      tab="wduty";
      loadW();
    }else{
      toast("Duty assigned successfully! You can now record readings.");
      tab="wduty";
      loadW();
    }
  }).catch(function(e){
    if(btn){
      btn.disabled=false;
      btn.textContent=isHandover?"🤝 Confirm handover & assign duty":"Assign duty & start shift";
    }
    if(errDiv)errDiv.textContent=e.error||"Could not assign duty.";
    else toast(e.error||"Could not assign duty.");
  });
}

var h='<div class="cust" style="cursor:default"><div class="row"><b>'+esc(w.name)+'</b><span class="amt" style="flex:none">'+inr(w.net)+'</span></div><div class="sub">Net pay for the month</div>'+(w.missing_rate?'<div class="sub" style="color:var(--due)">Some duties have no rate set, so they count as zero.</div>':'')+(w.pending?'<div class="sub" style="color:var(--warn)">'+w.pending+' duty not yet closed, not counted</div>':'')+
'<div class="tbl" style="margin-top:8px"><table style="min-width:0">'+L("Duties<div class=\"sub\">"+esc(du)+"</div>",inr(w.earn))+L("Bonus","+"+inr(w.bonus))+L("Advances","\u2212"+inr(w.advance),'var(--due)')+L("Cash shortage"+(w.waived?'<div class="sub">'+inr(w.waived)+' waived</div>':''),"\u2212"+inr(Math.max(0,w.short-w.waived)),'var(--due)')+L("Already paid","\u2212"+inr(w.paid))+L("<b>Balance to pay</b>","<b>"+inr(w.balance)+"</b>")+'</table></div>';
if(w.items.length){h+='<div class="sub" style="margin-top:10px">Entries this month</div>';w.items.forEach(function(x){h+='<div class="row" style="margin-top:6px"><span>'+esc(KL[x.kind])+(x.note?' \u00b7 '+esc(x.note):'')+'<div class="sub">'+x.d+'</div></span><span style="flex:none;text-align:right">'+inr(x.amount)+'</span>'+(own?'':'<button class="ghost" style="flex:none;padding:5px 8px" onclick="delPay('+x.id+')">Delete</button>')+'</div>'})}
if(!own)h+='<div class="btns" style="margin:12px 0 0"><button class="ghost" onclick="rateForm('+w.id+')">Set rates</button><button class="ghost" onclick="payForm('+w.id+',\'advance\')">Advance</button><button class="ghost" onclick="payForm('+w.id+',\'bonus\')">Bonus</button>'+(w.short>w.waived?'<button class="ghost" onclick="payForm('+w.id+',\'waive\')">Waive shortage</button>':'')+'<button onclick="payForm('+w.id+',\'paid\')">Record payment</button></div>';
return h+'</div>'}
function monthPick(fn){return '<label>Month<input type="month" value="'+PM+'" onchange="PM=this.value||PM;'+fn+'()"></label>'}
function renderSalary(){var A=document.getElementById("app");if(!SRV){A.innerHTML=nav()+'<div class="empty">Salary needs the server. It is not available in this preview.</div>';return}
tab="pay";A.innerHTML=nav()+'<div class="empty">Loading\u2026</div>';
api("GET","/api/payroll?month="+PM).then(function(r){if(tab!="pay")return;var h=nav()+'<h1>Worker salary</h1>'+monthPick("renderSalary")+'<div class="sub" style="margin-top:6px">Pay = closed duties \u00d7 rate, plus bonus, minus advances and cash shortages. Only the owner can see this tab.</div>';
if(!r.workers.length)h+='<div class="empty">No workers yet. Add them in the Team tab.</div>';
r.workers.forEach(function(w){h+=payCard(w,false)});A.innerHTML=h}).catch(function(e){badge(e.error||"Could not load salary.")})}
function loadMyPay(){api("GET","/api/my-pay?month="+PM).then(function(r){document.getElementById("app").innerHTML=ubar()+wnav()+'<h1>My pay</h1>'+monthPick("loadMyPay")+'<div style="margin-top:10px">'+payCard(r.worker,true)+'</div>'}).catch(function(e){document.getElementById("app").innerHTML=ubar()+wnav()+'<div class="empty">Could not load. '+esc(e.error||"Check your connection.")+'</div>'})}
function rateForm(id){api("GET","/api/payroll?month="+PM).then(function(r){var x=r.workers.filter(function(k){return k.id==id})[0];openM('<h2>Pay per duty</h2><div class="sub">'+esc(x.name)+'. Leave a shift blank if they do not work it.</div>'+SHS.map(function(sh,i){return '<label>'+sh+' duty (\u20b9)<input id="r'+i+'" inputmode="decimal" value="'+(x.rates[sh]!=null?x.rates[sh]:"")+'"></label>'}).join("")+'<div class="err" id="er"></div><div class="row" style="margin-top:12px"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveRates('+id+')">Save rates</button></div>')})}
function saveRates(id){var b={};SHS.forEach(function(sh,i){b[sh]=v("r"+i)});api("PUT","/api/payroll/rates",{worker_id:id,rates:b}).then(function(){close();renderSalary()}).catch(function(e){er(e.error||"Could not save.")})}
function payForm(id,kind){var T={advance:"Advance given",bonus:"Bonus or extra pay",waive:"Waive cash shortage",paid:"Record salary payment"};
openM('<h2>'+T[kind]+'</h2><div class="sub">For '+PM+'</div><label>Amount (\u20b9)<input id="m1" inputmode="decimal"></label><label>Note (optional)<input id="m2"></label><div class="err" id="er"></div><div class="row" style="margin-top:12px"><button class="ghost" onclick="close()">Cancel</button><button onclick="savePay('+id+',\''+kind+'\')">Save</button></div>')}
function savePay(id,kind){api("POST","/api/payroll/items",{worker_id:id,month:PM,kind:kind,amount:v("m1"),note:v("m2")}).then(function(){close();renderSalary()}).catch(function(e){er(e.error||"Could not save.")})}
function delPay(id){ask("Delete this entry?",function(){api("DELETE","/api/payroll/items/"+id).then(renderSalary).catch(function(e){badge(e.error||"Could not delete.")})})}
var SUM=null;
function sumForm(){api("GET","/api/daily-summary?d="+DD).then(function(r){SUM=r;openM('<h2>Daily summary</h2><div class="sub">For '+DD+'. Check it, then send it on WhatsApp.</div><textarea id="st" style="width:100%;height:230px;margin-top:8px;font:13px/1.4 monospace;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px"></textarea><label>Send to WhatsApp number (leave blank to choose in WhatsApp)<input id="sn" inputmode="tel" value="'+esc(r.to)+'"></label><div class="err" id="er"></div><div class="row" style="margin-top:12px"><button class="ghost" onclick="close()">Close</button><button class="ghost" onclick="copySum()">Copy</button><button onclick="sendSum()">Open WhatsApp</button></div>');document.getElementById("st").value=r.text}).catch(function(e){badge(e.error||"Could not build the summary.")})}
function copySum(){var t=document.getElementById("st");t.select();try{document.execCommand("copy");er("Copied.")}catch(e){er("Select the text and copy it.")}}
function sendSum(){var n=v("sn").replace(/\D/g,"").slice(-10),t=document.getElementById("st").value;window.open("https://wa.me/"+(n.length==10?"91"+n:"")+"?text="+encodeURIComponent(t),"_blank")}
var BK=null,BT="Dear {name}, your outstanding balance is {amount}. Please clear it at your earliest convenience. Thank you.";
function bulkForm(){var L=S.c.filter(function(c){return due(c)>0}).sort(function(a,b){return due(b)-due(a)});
if(!L.length)return openM('<h2>No dues</h2><div class="sub">No customer owes anything right now.</div><div class="btns"><button onclick="close()">Close</button></div>');
BK={sent:{},ids:L.map(function(c){return c.id})};var tot=L.reduce(function(s,c){return s+due(c)},0);
openM('<h2>Payment reminders</h2><div class="sub">'+L.length+' customer'+(L.length>1?'s owe ':' owes ')+inr(tot)+' in total. WhatsApp opens one chat at a time: tap Send for each customer, or Open next to go down the list.</div><label>Message<textarea id="bm" style="width:100%;height:90px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px;font:inherit">'+esc(BT)+'</textarea></label><div class="sub">{name} and {amount} are filled in for each customer.</div><div id="bl" style="margin-top:10px"></div><div class="row" style="margin-top:12px"><button class="ghost" onclick="close();render()">Close</button><button onclick="bulkNext()">Open next</button></div>');
bulkList()}
function bulkList(){var h="";BK.ids.forEach(function(id){var c=find(id);h+='<div class="row" style="margin-top:8px"><span><b>'+esc(c.name)+'</b><div class="sub">'+inr(due(c))+(c.reminded?' \u00b7 last reminded '+c.reminded.slice(5):'')+'</div></span><button class="'+(BK.sent[id]?'ghost':'')+'" style="flex:none;padding:8px 12px" onclick="bulkSend('+id+')">'+(BK.sent[id]?'Sent \u2713':'Send')+'</button></div>'});document.getElementById("bl").innerHTML=h}
function bulkSend(id){var c=find(id);BT=document.getElementById("bm").value;var m=BT.replace(/\{name\}/g,c.name).replace(/\{amount\}/g,inr(due(c)));window.open("https://wa.me/91"+c.phone.slice(-10)+"?text="+encodeURIComponent(m),"_blank");BK.sent[id]=1;c.reminded=today();save();bulkList()}
function bulkNext(){var id=BK.ids.filter(function(i){return !BK.sent[i]})[0];if(id==null)return;bulkSend(id)}
function ubar(){return SRV&&ME?'<div class="row noprint" style="margin-bottom:10px;gap:6px"><span class="sub" style="flex:1">'+esc(ME.name)+' ('+ME.role+')</span><button class="ghost" style="padding:5px 10px;flex:none" onclick="pwForm()">Password</button><button class="ghost" style="padding:5px 10px;flex:none" onclick="logout()">Log out</button></div>':''}
function boot(){api("GET","/api/me").then(function(m){SRV=true;ME=m.user;if(!ME){TOKEN="";try{localStorage.removeItem("petrol-token")}catch(e){}return authView(m.setup)}start()}).catch(function(){SRV=false;localStart()})}
function start(){view=null;if(!ME)return authView(false);if(ME.role=="worker"){tab="wduty";return loadW()}tab="ledger";
api("GET","/api/state").then(function(r){VER=r.ver;S=r.state||emptyS();["c","inv","items","sup","bk","nozzles","tanks","deliv","rates","expcats","paymodes"].forEach(function(k){S[k]=S[k]||[]});S.ob=S.ob||{Cash:0,Bank:0,UPI:0};S.biz=S.biz||{name:"",addr:"",gst:""};pullDuty(render)}).catch(function(e){badge("Could not load data: "+(e.error||"check your connection"));if(!S)S=emptyS();render()})}
function authView(setup){var h='<h1 style="font-size:22px;color:var(--ink);font-weight:800;margin:20px 0 4px">Petrol pump manager</h1><div class="sub">'+(setup?'Create the owner account to get started.':'Log in with your mobile number and password.')+'</div>'+(setup?'<label>Your name<input id="a0"></label>':'')+'<label>Mobile number<input id="a1" inputmode="tel" autocomplete="username"></label><label>Password<input id="a2" type="password" autocomplete="'+(setup?'new-password':'current-password')+'"></label><div class="err" id="er"></div><button style="width:100%;margin-top:6px" onclick="doAuth('+(setup?1:0)+')">'+(setup?'Create owner account':'Log in')+'</button>';
document.getElementById("app").innerHTML=h;document.getElementById("a2").onkeydown=function(e){if(e.key=="Enter")doAuth(setup?1:0)}}
function doAuth(setup){var b={mobile:v("a1"),password:document.getElementById("a2").value};if(setup)b.name=v("a0");api("POST",setup?"/api/setup":"/api/login",b).then(function(r){if(r.token){TOKEN=r.token;try{localStorage.setItem("petrol-token",TOKEN)}catch(e){}}ME=r.user;start()}).catch(function(e){er(e.error||"Could not log in. Check your connection.")})}
function logout(){api("POST","/api/logout").then(function(){TOKEN="";try{localStorage.removeItem("petrol-token")}catch(e){}location.reload()}).catch(function(){TOKEN="";try{localStorage.removeItem("petrol-token")}catch(e){}location.reload()})}
function pwForm(){openM('<h2>Change password</h2><label>Current password<input id="p1" type="password"></label><label>New password (6+ characters)<input id="p2" type="password"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="savePw()">Change password</button></div>')}
function savePw(){api("POST","/api/password",{old:document.getElementById("p1").value,password:document.getElementById("p2").value}).then(function(){openM('<h2>Password changed</h2><div class="btns"><button onclick="close()">Close</button></div>')}).catch(function(e){er(e.error||"Could not change the password.")})}
function loadCredit(){Promise.all([api("GET","/api/customers"),api("GET","/api/my-credit-sales")]).then(function(r){CL=r[0];MY=r[1];renderCredit()}).catch(function(e){document.getElementById("app").innerHTML=ubar()+'<div class="empty">Could not load. '+esc(e.error||"Check your connection.")+'</div>'})}
function renderCredit(){var h=ubar()+wnav()+'<h1>Credit sale</h1><div class="sub" style="margin-bottom:4px">Saved sales appear in the customer ledger straight away.</div><label>Customer<select id="d1" onchange="dcust()"><option value="">Choose customer</option>'+CL.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select></label><div class="sub" id="d0" style="margin-top:4px"></div><label>Vehicle number<input id="d2" list="vl" autocapitalize="characters"><datalist id="vl"></datalist></label><label>Fuel or item and quantity<input id="d3" placeholder="e.g. HSD 50 L"></label><label>Amount (\u20b9)<input id="d4" inputmode="decimal"></label><div class="err" id="er"></div><button id="btnCreditSave" style="width:100%" onclick="saveDuty(0)">Save credit sale</button><h1 style="margin-top:22px">My recent entries</h1>';
if(!MY.length)h+='<div class="empty">No entries yet.</div>';
MY.forEach(function(x){h+='<div class="cust" style="cursor:default"><div class="row"><b>'+esc(x.cname)+'</b><span class="amt" style="flex:none">'+inr(x.a)+'</span></div><div class="sub">'+x.d+' \u00b7 '+esc(x.n)+(x.veh?' \u00b7 '+esc(x.veh):'')+'</div>'+(x.status=="pending"?'<div class="sub" style="color:var(--warn)">Waiting for manager approval</div>':x.status=="rejected"?'<div class="sub" style="color:var(--due)">Rejected by manager</div>':'')+'</div>'});
document.getElementById("app").innerHTML=h}
function dcust(){var c=CL.filter(function(x){return x.id==v("d1")})[0];document.getElementById("vl").innerHTML=c?c.veh.map(function(x){return '<option value="'+esc(x)+'">'}).join(""):"";document.getElementById("d0").textContent=c?"Credit available: "+inr(c.available):""}
function saveDuty(force){var a=parseFloat(v("d4")),b={cust_id:v("d1"),n:v("d3"),a:a,veh:v("d2"),force:!!force};
if(!b.cust_id)return er("Choose a customer.");if(!b.n)return er("Enter the fuel or item and quantity.");if(!(a>0))return er("Enter an amount above zero.");
var btn=document.getElementById("btnCreditSave");if(btn){btn.disabled=true;btn.textContent="Saving...";}
var c=CL.filter(function(x){return x.id==b.cust_id})[0],go=function(){api("POST","/api/credit-sales",b).then(function(res){toast("Credit sale of "+inr(a)+(res&&res.pending?" (waiting approval)":"")+" saved.");loadCredit()}).catch(function(e){if(btn){btn.disabled=false;btn.textContent="Save credit sale";}er(e.error||"Could not save. Check your connection.")})};
if(c&&a>c.available){if(btn){btn.disabled=false;btn.textContent="Save credit sale";}return ask("This is more than the customer's available credit ("+inr(c.available)+"). It will be sent to a manager for approval. Continue?",go);}go()}
function renderTeam(){tab="setup";SU="team";renderSetup()}
function userForm(){openM('<h2>Add user</h2><label>Name<input id="u1"></label><label>Mobile number (used to log in)<input id="u2" inputmode="tel"></label><label>Role<select id="u3"><option value="worker">Worker</option>'+(ME.role=="owner"?'<option value="manager">Manager</option>':'')+'</select></label><label>Password (6+ characters)<input id="u4" autocomplete="off"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveUser()">Save user</button></div>')}
function saveUser(){api("POST","/api/users",{name:v("u1"),mobile:v("u2"),role:v("u3"),password:document.getElementById("u4").value}).then(function(){close();renderTeam()}).catch(function(e){er(e.error||"Could not save.")})}
function userAct(id,w){api("PATCH","/api/users/"+id,{active:w=="on"}).then(renderTeam).catch(function(e){badge(e.error||"Could not update the user.")})}
function resetPw(id){openM('<h2>Reset password</h2><label>New password (6+ characters)<input id="u4" autocomplete="off"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="savePw2('+id+')">Reset password</button></div>')}
function savePw2(id){api("PATCH","/api/users/"+id,{password:document.getElementById("u4").value}).then(function(){close();renderTeam()}).catch(function(e){er(e.error||"Could not reset the password.")})}
setInterval(function(){if(!SRV||!ME||ME.role=="worker"||tab!="ledger"||document.getElementById("modal").classList.contains("on"))return;var a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;pullDuty(render)},30000);
boot();
</script>
</body>
</html>
